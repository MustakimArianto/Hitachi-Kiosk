# Hardware (JitPack, group-restricted in settings.gradle.kts)
imin-printer = { module = "com.github.iminsoftware:IminPrinterLibrary", version.ref = "imin-printer" }
imin-device = { module = "com.github.iminsoftware:IminDeviceLibrary", version.ref = "imin-device" }

# Logging and diagnostics
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
androidx-metrics-performance = { module = "androidx.metrics:metrics-performance", version.ref = "jankstats" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

# Tests
junit4 = { module = "junit:junit", version.ref = "junit4" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# Robolectric 4.17 starts the SDK 37 image, but Compose draws nothing there in NATIVE graphics mode, so the
# JVM screenshot tests run on SDK 36. API 37 is covered by the instrumented tests (technical-design §16).
sdk=36
# Unit tests build their classes by hand with fakes (architecture §10), so they run on a plain Application instead
# of KioskApp, which would build the Hilt graph and start WorkManager and the sync triggers in every test.
application=android.app.Application

# Gradle
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# App version (conventions §10, technical-design §2.4): versionCode = major*10000 + minor*100 + patch
kiosk.version.major=0
kiosk.version.minor=1
kiosk.version.patch=0

# Backend environments (technical-design §2.3, api-spec §2.1). Select one with -Pkiosk.env=dev|staging|prod;
# by default debug builds use dev and release builds use prod.
kiosk.baseUrl.dev=https://dev-api.hitachikiosk.example/
kiosk.baseUrl.staging=https://staging-api.hitachikiosk.example/
kiosk.baseUrl.prod=https://api.hitachikiosk.example/
# Prism mock server as seen from the emulator. Debug builds only (Developer options).
kiosk.baseUrl.mock=http://10.0.2.2:4010/
# Certificate pins (SPKI SHA-256, comma separated) are not committed. Pass -Pkiosk.pins.staging=... /
# -Pkiosk.pins.prod=... or set KIOSK_PINS_STAGING / KIOSK_PINS_PROD (TR-SEC-03).

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

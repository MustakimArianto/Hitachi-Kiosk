<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hitachi Kiosk · Transaction complete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F5}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
.press{transition:transform 160ms cubic-bezier(.2,0,0,1)}
.press:active{transform:scale(.96)}
@keyframes flood{0%{clip-path:circle(0% at 50% 24%);opacity:1}55%{clip-path:circle(150% at 50% 24%);opacity:1}100%{clip-path:circle(150% at 50% 24%);opacity:0}}
@keyframes badgeIn{0%{transform:scale(0)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes ringWave{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
@keyframes confetti{0%{opacity:0;transform:translateY(0) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translateY(var(--d)) scale(1)}}
@keyframes rise{0%{transform:translateY(105%)}100%{transform:none}}
@keyframes up{0%{opacity:0;transform:translateY(32px)}100%{opacity:1;transform:none}}
@keyframes ticketIn{0%{opacity:0;transform:translateY(70px)}100%{opacity:1;transform:none}}
@keyframes print{0%{transform:translateY(-100%)}100%{transform:none}}
@keyframes deplete{from{stroke-dashoffset:0}to{stroke-dashoffset:126}}
@keyframes digit{0%{opacity:0;transform:translateY(50%)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
.rm *,.rm *::before,.rm *::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
</style>
</helmet>
<div class="{{rootClass}}" style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #FAF8F5; color: #171513; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: {{accent}}; animation: flood 1500ms cubic-bezier(.65,0,.35,1) both; pointer-events: none"></div>

  <div style="position: absolute; left: 72px; right: 72px; top: 120px; display: flex; justify-content: center">
    <div style="overflow: hidden"><span style="display: block; font-size: 30px; font-weight: 600; color: #2F7A50; animation: rise 700ms cubic-bezier(.16,1,.3,1) 1100ms both">Payment successful</span></div>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 540px; top: 400px; width: 0; height: 0">
    <div style="position: absolute; left: -130px; top: -130px; width: 260px; height: 260px; border-radius: 50%; border: 3px solid {{accent}}; animation: ringWave 1600ms cubic-bezier(.2,0,0,1) 1050ms both"></div>
    <div style="position: absolute; left: -130px; top: -130px; width: 260px; height: 260px; border-radius: 50%; border: 2px solid #171513; animation: ringWave 1600ms cubic-bezier(.2,0,0,1) 1300ms both"></div>
    <sc-for list="{{bits}}" as="b" hint-placeholder-count="20">
      <span style="position: absolute; transform: rotate({{b.deg}}deg)"><span style="display: block; width: {{b.s}}px; height: {{b.s}}px; margin: -6px 0 0 -6px; border-radius: 50%; background: {{b.color}}; --d: {{b.dist}}px; animation: confetti 1500ms cubic-bezier(.15,.6,.3,1) {{b.delay}}ms both"></span></span>
    </sc-for>
  </div>

  <div style="position: absolute; left: 420px; top: 280px; width: 240px; height: 240px; border-radius: 50%; background: {{accent}}; box-shadow: 0 30px 60px {{accentShadow}}; display: flex; align-items: center; justify-content: center; animation: badgeIn 700ms cubic-bezier(.3,1.15,.4,1) 900ms both">
    <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 128px; height: 128px"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" style="animation: draw 560ms cubic-bezier(.2,0,0,1) 1250ms both"></path></svg>
  </div>

  <div style="position: absolute; left: 72px; right: 72px; top: 580px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px">
    <div style="overflow: hidden"><h1 style="margin: 0; font-size: 112px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.04; animation: rise 900ms cubic-bezier(.16,1,.3,1) 1300ms both">Thank you!</h1></div>
    <p style="margin: 0; font-size: 30px; color: #6F6961; animation: up 700ms cubic-bezier(.16,1,.3,1) 1420ms both">Rp 173.000 paid with QRIS</p>
  </div>

  <div style="position: absolute; left: 72px; right: 72px; top: 860px; border-radius: 48px; background: #FFFFFF; border: 2px solid #EFE9E0; padding: 48px 56px 48px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 24px 48px rgba(23,21,19,.06); animation: ticketIn 900ms cubic-bezier(.16,1,.3,1) 1500ms both">
    <span style="font-size: 30px; font-weight: 600; color: #6F6961">Your order number</span>
    <span style="display: flex; gap: 4px">
      <sc-for list="{{digits}}" as="dg" hint-placeholder-count="4">
        <span style="display: inline-block; font-size: 240px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: {{dg.color}}; animation: digit 600ms cubic-bezier(.16,1,.3,1) {{dg.delay}}ms both">{{dg.c}}</span>
      </sc-for>
    </span>
    <span style="width: 100%; border-top: 2px dashed #E9E4DC; margin: 18px 0"></span>
    <span style="display: flex; align-items: center; gap: 20px; font-size: 30px; line-height: 1.4; text-align: left; color: #171513; text-wrap: pretty">
      <span style="width: 72px; height: 72px; flex-shrink: 0; border-radius: 22px; background: #F1EDE7; display: flex; align-items: center; justify-content: center"><sc-if value="{{isDine}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" viewBox="0 0 24 24" style="width: 40px; height: 40px"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 0-3.5 2.5-3.5 6v4H17" fill="none" stroke="#171513" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if><sc-if value="{{isTakeaway}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" viewBox="0 0 24 24" style="width: 40px; height: 40px"><path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8zM9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="#171513" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if></span>
      {{infoText}}
    </span>
  </div>

  <sc-if value="{{printFailed}}" hint-placeholder-val="{{ false }}">
    <div role="alert" style="position: absolute; left: 72px; right: 72px; top: 1470px; min-height: 176px; border-radius: 40px; background: #FFFFFF; border: 2px solid {{accent}}; padding: 28px 36px; display: flex; align-items: center; gap: 28px; animation: up 700ms cubic-bezier(.16,1,.3,1) 1900ms both">
      <span aria-hidden="true" style="width: 88px; height: 88px; flex-shrink: 0; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" style="width: 48px; height: 48px"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7zM4 4l16 16" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 32px; font-weight: 700; line-height: 1.2">Receipt couldn’t print</span><span style="font-size: 28px; font-weight: 500; line-height: 1.35; color: #6F6961; text-wrap: pretty">Please show this screen at the counter.</span></span>
    </div>
  </sc-if>
  <sc-if value="{{printOk}}" hint-placeholder-val="{{ true }}">
  <div aria-hidden="true" style="position: absolute; left: 300px; top: 1480px; width: 480px; height: 24px; border-radius: 12px; background: #171513; animation: up 600ms cubic-bezier(.16,1,.3,1) 1900ms both"></div>
  <div aria-hidden="true" style="position: absolute; left: 340px; top: 1492px; width: 400px; height: 150px; overflow: hidden">
    <div style="width: 400px; height: 150px; background: #FFFFFF; border: 1px solid #EFE9E0; padding: 26px 30px; display: flex; flex-direction: column; gap: 14px; animation: print 1800ms cubic-bezier(.2,0,0,1) 2100ms both">
      <span style="display: block; width: 46%; height: 10px; border-radius: 5px; background: #171513"></span>
      <span style="display: block; width: 86%; height: 8px; border-radius: 4px; background: #E9E4DC"></span>
      <span style="display: block; width: 66%; height: 8px; border-radius: 4px; background: #E9E4DC"></span>
      <span style="display: block; width: 30%; height: 10px; border-radius: 5px; background: {{accent}}; align-self: flex-end"></span>
    </div>
  </div>

  </sc-if>

  <div style="position: absolute; left: 72px; right: 72px; bottom: 48px; height: 168px; padding: 0 12px 0 40px; border-radius: 48px; background: #FFFFFF; border: 2px solid #EFE9E0; display: flex; align-items: center; gap: 24px; animation: up 700ms cubic-bezier(.16,1,.3,1) 2000ms both">
    <span style="flex-grow: 1; display: flex; align-items: center; gap: 18px; font-size: 28px; font-weight: 500; color: #6F6961">
      <svg aria-hidden="true" viewBox="0 0 48 48" style="width: 56px; height: 56px; transform: rotate(-90deg)"><circle cx="24" cy="24" r="20" fill="none" stroke="#E9E4DC" stroke-width="4"></circle><circle cx="24" cy="24" r="20" fill="none" stroke="{{accent}}" stroke-width="4" stroke-linecap="round" stroke-dasharray="126" style="animation: deplete 20s linear 1.8s both"></circle></svg>
      <span>Back to the start in {{secs}}s</span>
    </span>
    <a ref="{{setLink}}" href="Idle.dc.html" class="press" style="height: 144px; padding: 0 96px; border-radius: 36px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center"><span style="font-size: 36px; font-weight: 700">Done</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8552B","options":["#C8552B","#2F5D4A","#3A4C7A","#171513"]},"brand":{"editor":"text","default":"Urban Grill"},"reduceMotion":{"editor":"boolean","default":false},"scenario":{"editor":"enum","options":["dineIn","takeaway","printFailed"],"default":"dineIn"},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { secs: 20 };
  }
  componentDidMount() {
    this.t = setInterval(() => {
      if (this.state.secs <= 1) { clearInterval(this.t); this.setState({ secs: 0 }); if (this.link) this.link.click(); }
      else this.setState((s) => ({ secs: s.secs - 1 }));
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.t); }
  hexA(hex, a) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  renderVals() {
    const sc = this.props.scenario || 'dineIn';
    const accent = this.props.accent ?? '#C8552B';
    const colors = [accent, '#171513', '#D8CFC2', accent, '#171513'];
    return {
      rootClass: this.props.reduceMotion ? 'rm' : '',
      accent: accent,
      accentShadow: this.hexA(accent, .3),
      secs: this.state.secs,
      isDine: sc !== 'takeaway',
      isTakeaway: sc === 'takeaway',
      printFailed: sc === 'printFailed',
      printOk: sc !== 'printFailed',
      infoText: sc === 'takeaway' ? 'Takeaway · Pick up at the counter when your number is called.' : sc === 'printFailed' ? 'Dine in · Remember your number and watch the screen. We’ll call it when your tray is ready.' : 'Dine in · Take your receipt and watch the screen. We’ll call your number when your tray is ready.',
      setLink: (el) => { this.link = el; },
      digits: 'A247'.split('').map((c, i) => ({ c, delay: 1700 + i * 90, color: i === 0 ? accent : '#171513' })),
      bits: Array.from({ length: 20 }, (_, i) => ({
        deg: i * 18 + (i % 3) * 5,
        s: i % 3 === 0 ? 14 : (i % 3 === 1 ? 10 : 7),
        dist: -(220 + (i % 4) * 46),
        delay: 1150 + (i % 5) * 35,
        color: colors[i % 5]
      }))
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hitachi Kiosk · Still there?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F5}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
h1{text-wrap:balance}
.press{transition:transform 140ms cubic-bezier(.2,0,0,1)}
.press:active{transform:scale(.96)}
@keyframes scrimIn{0%{opacity:0}100%{opacity:1}}
@keyframes cardIn{0%{opacity:0;transform:translateY(80px) scale(.94)}100%{opacity:1;transform:none}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
@keyframes ringIn{0%{opacity:0;transform:scale(.7) rotate(-20deg)}100%{opacity:1;transform:none}}
@keyframes numA{0%{opacity:0;transform:translateY(-50%)}100%{opacity:1;transform:none}}
@keyframes numB{0%{opacity:0;transform:translateY(-50%)}100%{opacity:1;transform:none}}
@keyframes urgentA{0%{transform:scale(1)}30%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes urgentB{0%{transform:scale(1)}30%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes haloA{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
@keyframes haloB{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
.rm *,.rm *::before,.rm *::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
</style>
</helmet>
<div class="{{rootClass}}" style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #FAF8F5; color: #171513; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif">

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; z-index: 0; isolation: isolate; overflow: hidden">
    <dc-import name="Menu" idle-off="{{ true }}" hint-size="1080px,1920px"></dc-import>
  </div>

  <a href="Menu.dc.html" aria-hidden="true" tabindex="-1" style="position: absolute; inset: 0; z-index: 1; background: rgba(23,21,19,.48); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: scrimIn 600ms cubic-bezier(.16,1,.3,1) both"></a>

  <section role="alertdialog" aria-labelledby="st-title" aria-describedby="st-body" style="position: absolute; left: 72px; right: 72px; top: 460px; z-index: 2; border-radius: 56px; background: #FFFFFF; padding: 80px 72px 64px; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 24px 48px rgba(23,21,19,.10); animation: cardIn 800ms cubic-bezier(.16,1,.3,1) 120ms both">

    <div style="position: relative; width: 280px; height: 280px; animation: ringIn 900ms cubic-bezier(.16,1,.3,1) 260ms both">
      <sc-if value="{{urgent}}" hint-placeholder-val="{{ false }}">
        <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 4px solid {{accent}}; animation: {{haloAnim}}"></span>
      </sc-if>
      <div style="position: absolute; inset: 0; animation: {{urgentAnim}}">
        <svg aria-hidden="true" viewBox="0 0 280 280" style="position: absolute; inset: 0; width: 280px; height: 280px; transform: rotate(-90deg)">
          <circle cx="140" cy="140" r="124" fill="none" stroke="#F1EDE7" stroke-width="16"></circle>
          <circle cx="140" cy="140" r="124" fill="none" stroke="{{accent}}" stroke-width="16" stroke-linecap="round" stroke-dasharray="779" stroke-dashoffset="{{dash}}" style="transition: stroke-dashoffset 1000ms linear"></circle>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="height: 104px; overflow: hidden; display: block"><span style="display: inline-block; font-size: 96px; font-weight: 800; line-height: 104px; letter-spacing: -3px; font-variant-numeric: tabular-nums; animation: {{numAnim}}">{{secs}}</span></span>
          <span style="font-size: 24px; font-weight: 600; color: #6F6961">seconds</span>
        </div>
      </div>
    </div>

    <h1 id="st-title" style="margin: 56px 0 0; font-size: 80px; font-weight: 700; letter-spacing: -2.4px; line-height: 1.0; animation: fadeUp 700ms cubic-bezier(.16,1,.3,1) 380ms both">Still there?</h1>
    <p id="st-body" aria-live="polite" style="margin: 20px 0 0; max-width: 680px; font-size: 30px; line-height: 1.4; color: #6F6961; animation: fadeUp 700ms cubic-bezier(.16,1,.3,1) 440ms both">Your order will be cancelled in {{secs}} s. Tap anywhere to keep ordering.</p>

    <div style="margin-top: 56px; width: 100%; display: flex; flex-direction: column; align-items: stretch; gap: 16px; animation: fadeUp 700ms cubic-bezier(.16,1,.3,1) 520ms both">
      <a href="Menu.dc.html" class="press" style="height: 152px; border-radius: 40px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 34px; font-weight: 700">
        Continue ordering
        <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 40px; height: 40px"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </a>
      <a href="Idle.dc.html" class="press" style="height: 104px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 600; color: #6F6961">Start over</a>
    </div>
  </section>

  <a ref="{{setLink}}" href="Idle.dc.html" aria-hidden="true" tabindex="-1" style="position: absolute; z-index: 3; width: 1px; height: 1px; overflow: hidden; opacity: 0">Timed out</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8552B","options":["#C8552B","#2F5D4A","#3A4C7A","#171513"]},"reduceMotion":{"editor":"boolean","default":false},"scenario":{"editor":"enum","options":["default","countdownLow"],"default":"default"},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { secs: (props.scenario || 'default') === 'countdownLow' ? 5 : 15 };
  }
  componentDidMount() {
    this.t = setInterval(() => {
      if (this.state.secs <= 1) {
        clearInterval(this.t);
        this.setState({ secs: 0 });
        this.go = setTimeout(() => { if (this.link) this.link.click(); }, 400);
      } else {
        this.setState((s) => ({ secs: s.secs - 1 }));
      }
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.t); clearTimeout(this.go); }
  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#C8552B';
    const p = s.secs % 2 ? 'A' : 'B';
    const urgent = s.secs <= 5 && s.secs > 0;
    return {
      rootClass: this.props.reduceMotion ? 'rm' : '',
      accent: accent,
      secs: s.secs,
      dash: Math.round(779 * (1 - s.secs / 15)),
      numAnim: s.secs < 15 ? 'num' + p + ' 420ms cubic-bezier(.16,1,.3,1) both' : 'none',
      urgent: urgent,
      urgentAnim: urgent ? 'urgent' + p + ' 600ms cubic-bezier(.3,1.4,.5,1) both' : 'none',
      haloAnim: 'halo' + p + ' 900ms cubic-bezier(.2,0,0,1) both',
      setLink: (el) => { this.link = el; }
    };
  }
}
</script>
</body>
</html>

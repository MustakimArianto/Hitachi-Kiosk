<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hitachi Kiosk · Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F5}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
h1,h2{text-wrap:balance}
p{text-wrap:pretty}
.press{transition:transform 140ms cubic-bezier(.2,0,0,1)}
.press:active{transform:scale(.96)}
@keyframes up{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@keyframes rise{0%{transform:translateY(105%)}100%{transform:none}}
@keyframes dock{0%{opacity:0;transform:translateY(120px)}100%{opacity:1;transform:none}}
@keyframes markIn{0%{opacity:0;transform:scale(.7) rotate(-6deg)}100%{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
.rm *,.rm *::before,.rm *::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
</style>
</helmet>
<div class="{{rootClass}}" style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #FAF8F5; color: #171513; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif">

  <header style="position: absolute; left: 72px; right: 72px; top: 48px; height: 96px; display: flex; align-items: center; justify-content: space-between; animation: fade 600ms ease both">
    <span style="display: flex; align-items: center; gap: 20px; font-size: 34px; font-weight: 700; letter-spacing: -0.01em">
      <span style="width: 80px; height: 80px; border-radius: 24px; background: #171513; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; border-radius: 50%; background: {{accent}}; display: block"></span></span>
      Hitachi Kiosk
    </span>
    <span style="height: 96px; padding: 0 32px; border-radius: 999px; border: 2px solid #E9E4DC; display: flex; align-items: center; font-size: 28px; font-weight: 600; color: #6F6961">Version 1.0</span>
  </header>

  <main style="position: absolute; left: 72px; right: 72px; top: 168px; bottom: 360px; display: flex; flex-direction: column; justify-content: center; gap: 64px">
    <div style="width: 160px; height: 160px; border-radius: 48px; background: #171513; display: flex; align-items: center; justify-content: center; animation: markIn 800ms cubic-bezier(.16,1,.3,1) 80ms both">
      <span style="width: 52px; height: 52px; border-radius: 50%; background: {{accent}}; display: block; animation: breathe 3.2s ease-in-out 1s infinite"></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 32px">
      <p style="margin: 0; font-size: 26px; font-weight: 500; color: #6F6961; animation: up 700ms cubic-bezier(.16,1,.3,1) 160ms both">Welcome back</p>
      <h1 style="margin: 0; font-size: 112px; line-height: .98; letter-spacing: -0.035em; font-weight: 800">
        <span style="display: block; overflow: hidden; padding-bottom: 8px"><span style="display: block; animation: rise 900ms cubic-bezier(.16,1,.3,1) 160ms both">Sign in to start</span></span>
        <span style="display: block; overflow: hidden; padding-bottom: 8px"><span style="display: block; color: #6F6961; animation: rise 900ms cubic-bezier(.16,1,.3,1) 240ms both">taking orders.</span></span>
      </h1>
      <p style="margin: 0; max-width: 760px; font-size: 30px; line-height: 1.4; color: #6F6961; animation: up 700ms cubic-bezier(.16,1,.3,1) 320ms both">Use your Hitachi Kiosk account to load the restaurants this kiosk can serve.</p>
    </div>
  </main>

  <div style="position: absolute; left: 72px; right: 72px; bottom: 48px; display: flex; flex-direction: column; gap: 32px; animation: dock 800ms cubic-bezier(.16,1,.3,1) 300ms both">
    <button onClick="{{go}}" class="press" style="width: 100%; height: 152px; border: 0; border-radius: 40px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; padding: 0 24px 0 56px; cursor: pointer">
      <span style="font-size: 36px; font-weight: 700; letter-spacing: -0.01em">{{label}}</span>
      <span style="width: 104px; height: 104px; border-radius: 28px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center">
        <sc-if value="{{busy}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; border: 5px solid rgba(255,255,255,.35); border-top-color: #FFFFFF; animation: spin 800ms linear infinite; display: block"></span></sc-if>
        <sc-if value="{{idle}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" viewBox="0 0 24 24" style="width: 44px; height: 44px"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
      </span>
    </button>
    <p style="margin: 0 0 8px; text-align: center; font-size: 26px; font-weight: 500; color: #6F6961">Need help? Contact your Hitachi Kiosk administrator.</p>
  </div>

  <a ref="{{setLink}}" href="Merchants.dc.html" aria-hidden="true" tabindex="-1" style="position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8552B","options":["#C8552B","#2F5D4A","#3A4C7A","#171513"]},"brand":{"editor":"text","default":"Urban Grill"},"reduceMotion":{"editor":"boolean","default":false},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { busy: false }; }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    return {
      rootClass: this.props.reduceMotion ? 'rm' : '',
      accent: this.props.accent ?? '#C8552B',
      busy: this.state.busy,
      idle: !this.state.busy,
      label: this.state.busy ? 'Signing in…' : 'Log in',
      setLink: (el) => { this.link = el; },
      go: () => {
        if (this.state.busy) return;
        this.setState({ busy: true });
        this.t = setTimeout(() => { if (this.link) this.link.click(); }, 900);
      }
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hitachi Kiosk · Printer settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F5}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
input:focus{border-color:#171513!important;background:#FFFFFF!important}
.press{transition:transform 140ms cubic-bezier(.2,0,0,1),background-color 260ms}
.press:active{transform:scale(.96)}
.scroller{scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@keyframes up{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
@keyframes rise{0%{transform:translateY(100%)}100%{transform:none}}
@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popIn{0%{opacity:0;transform:scale(.4) rotate(-30deg)}70%{opacity:1;transform:scale(1.12)}100%{transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,122,80,.45)}100%{box-shadow:0 0 0 12px rgba(47,122,80,0)}}
@keyframes tileIn{0%{opacity:0;transform:scale(.7) rotate(-6deg)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>
</helmet>
<div style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #FAF8F5; color: #171513; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif">
  <header style="position: absolute; left: 0; right: 0; top: 0; height: 168px; padding: 48px 72px 0; display: flex; align-items: flex-start; justify-content: space-between; background: #FAF8F5; z-index: 2; animation: fade 400ms ease both">
    <a href="Settings.dc.html" class="press" style="height: 96px; padding: 0 36px 0 24px; border-radius: 999px; background: #F1EDE7; display: flex; align-items: center; gap: 12px; font-size: 30px; font-weight: 600">
      <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 40px; height: 40px"><path d="M15 5l-7 7 7 7" fill="none" stroke="#171513" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      Settings
    </a>
    <a href="Idle.dc.html" class="press" style="height: 96px; padding: 0 44px; border-radius: 999px; background: #171513; color: #FAF8F5; display: flex; align-items: center; font-size: 30px; font-weight: 600">Exit</a>
  </header>

  <main class="scroller" style="position: absolute; left: 0; right: 0; top: 168px; bottom: 0; overflow-y: auto; padding: 48px 72px 96px; display: flex; flex-direction: column; gap: 48px">
    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 26px; font-weight: 500; color: #6F6961; animation: up 600ms cubic-bezier(.16,1,.3,1) 40ms both">Kiosk settings</span>
      <div style="overflow: hidden"><h1 style="margin: 0; font-size: 80px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.02; animation: rise 900ms cubic-bezier(.16,1,.3,1) 80ms both">{{pageTitle}}</h1></div>
    </div>

    <section style="flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; animation: up 700ms cubic-bezier(.16,1,.3,1) 160ms both">
      <div style="display: flex; align-items: center; justify-content: space-between; padding-left: 8px">
        <h2 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">Printers</h2>
        <span style="font-size: 26px; font-weight: 500; color: #6F6961">Each role prints on one printer</span>
      </div>
      <div style="border-radius: 40px; background: #FFFFFF; border: 2px solid #EFE9E0; padding: 0 32px">
        <sc-for list="{{printers}}" as="pr" hint-placeholder-count="2">
          <div style="padding: 32px 0; display: flex; flex-direction: column; gap: 24px; border-bottom: 2px solid #F1EDE7; animation: up 600ms cubic-bezier(.16,1,.3,1) {{pr.delay}}ms backwards">
            <div style="display: flex; align-items: center; gap: 28px">
              <span style="width: 112px; height: 112px; flex-shrink: 0; border-radius: 32px; background: #F1EDE7; display: flex; align-items: center; justify-content: center; animation: tileIn 700ms cubic-bezier(.3,1.15,.4,1) {{pr.delay}}ms both">
                <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 52px; height: 52px"><path d="{{pr.icon}}" fill="none" stroke="#171513" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </span>
              <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
                <span style="font-size: 34px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15">{{pr.name}}</span>
                <span style="font-size: 26px; color: #6F6961; line-height: 1.3">{{pr.conn}} · {{pr.model}}</span>
              </span>
              <span style="flex-shrink: 0; height: 60px; padding: 0 24px; border-radius: 999px; background: #EAF3EC; color: #2F7A50; display: flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 600">
                <span style="width: 12px; height: 12px; border-radius: 50%; background: #2F7A50; animation: pulse 2s cubic-bezier(.2,0,0,1) infinite"></span>{{pr.status}}
              </span>
            </div>
            <div role="group" aria-label="Roles for {{pr.name}}" style="display: flex; align-items: center; gap: 16px; padding-left: 140px">
              <span style="font-size: 26px; font-weight: 500; color: #6F6961; margin-right: 8px">Prints</span>
              <sc-for list="{{pr.roles}}" as="ro" hint-placeholder-count="2">
                <button onClick="{{ro.pick}}" aria-pressed="{{ro.on}}" class="press" style="height: 80px; padding: 0 30px 0 22px; border-radius: 999px; background: {{ro.bg}}; color: {{ro.fg}}; border: 2px solid {{ro.border}}; display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 600; transition: background-color 360ms cubic-bezier(.2,0,0,1), color 360ms, border-color 360ms, transform 140ms">
                  <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: {{ro.dotBg}}; border: 2px solid {{ro.dotBorder}}; display: flex; align-items: center; justify-content: center; transition: background-color 360ms, border-color 360ms">
                    <sc-if value="{{ro.on}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" style="width: 24px; height: 24px; animation: popIn 420ms cubic-bezier(.3,1.15,.4,1) both"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
                  </span>
                  {{ro.label}}
                </button>
              </sc-for>
            </div>
          </div>
        </sc-for>
        <button onClick="{{toggleAdd}}" aria-expanded="{{adding}}" class="press" style="width: 100%; min-height: 136px; display: flex; align-items: center; gap: 28px; font-size: 32px; font-weight: 600">
          <span style="width: 112px; height: 112px; flex-shrink: 0; border-radius: 32px; border: 2px dashed #D9D2C8; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 44px; height: 44px; transform: rotate({{addRot}}deg); transition: transform 420ms cubic-bezier(.3,1.15,.4,1)"><path d="M12 5v14M5 12h14" fill="none" stroke="#171513" stroke-width="2" stroke-linecap="round"></path></svg>
          </span>
          {{addLabel}}
        </button>
        <sc-if value="{{adding}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 0 0 32px; display: flex; flex-direction: column; gap: 16px; animation: up 500ms cubic-bezier(.16,1,.3,1) both">
            <sc-for list="{{sources}}" as="src" hint-placeholder-count="3">
              <div style="border-radius: 32px; background: #FAF8F5; padding: 24px 28px; display: flex; flex-direction: column; gap: 12px; animation: up 500ms cubic-bezier(.16,1,.3,1) {{src.delay}}ms backwards">
                <span style="display: flex; align-items: center; gap: 16px">
                  <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 36px; height: 36px"><path d="{{src.icon}}" fill="none" stroke="#171513" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                  <span style="font-size: 30px; font-weight: 700">{{src.title}}</span>
                  <span style="font-size: 26px; color: #6F6961">{{src.note}}</span>
                </span>
                <sc-for list="{{src.devices}}" as="dv" hint-placeholder-count="1">
                  <div style="min-height: 96px; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-left: 52px">
                    <span style="display: flex; flex-direction: column; gap: 4px">
                      <span style="font-size: 30px; font-weight: 600">{{dv.name}}</span>
                      <span style="font-size: 24px; color: #6F6961">{{dv.detail}}</span>
                    </span>
                    <sc-if value="{{dv.canAdd}}" hint-placeholder-val="{{ true }}">
                      <button onClick="{{dv.add}}" class="press" style="flex-shrink: 0; height: 80px; padding: 0 32px; border-radius: 999px; background: #171513; color: #FFFFFF; display: flex; align-items: center; font-size: 28px; font-weight: 600">Add</button>
                    </sc-if>
                    <sc-if value="{{dv.added}}" hint-placeholder-val="{{ false }}">
                      <span style="flex-shrink: 0; height: 80px; padding: 0 28px; border-radius: 999px; background: #EAF3EC; color: #2F7A50; display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 600"><svg aria-hidden="true" viewBox="0 0 24 24" style="width: 28px; height: 28px; animation: popIn 420ms cubic-bezier(.3,1.15,.4,1) both"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#2F7A50" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>Added</span>
                    </sc-if>
                  </div>
                </sc-for>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </section>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; animation: up 700ms cubic-bezier(.16,1,.3,1) {{g.delay}}ms backwards">
        <h2 style="margin: 0 0 0 8px; font-size: 30px; font-weight: 700; letter-spacing: -0.01em">{{g.title}}</h2>
        <div style="border-radius: 40px; background: #FFFFFF; border: 2px solid #EFE9E0; padding: 0 40px">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <div style="min-height: 128px; padding: 24px 0; display: flex; align-items: center; justify-content: space-between; gap: 32px; border-bottom: {{r.line}}">
              <span style="min-width: 0; display: flex; flex-direction: column; gap: 6px">
                <span style="font-size: 32px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2">{{r.label}}</span>
                <sc-if value="{{r.hasSub}}" hint-placeholder-val="{{ true }}"><span style="font-size: 26px; font-weight: 400; color: #6F6961; line-height: 1.3">{{r.sub}}</span></sc-if>
              </span>
              <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{ false }}">
                <button role="switch" aria-checked="{{r.on}}" aria-label="{{r.label}}" onClick="{{r.act}}" style="position: relative; flex-shrink: 0; width: 120px; height: 68px; border-radius: 999px; background: {{r.track}}; transition: background-color 300ms cubic-bezier(.2,0,0,1)">
                  <span style="position: absolute; left: 6px; top: 6px; width: 56px; height: 56px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 6px rgba(23,21,19,.18); transform: translateX({{r.x}}px); transition: transform 420ms cubic-bezier(.3,1.15,.4,1); display: block"></span>
                </button>
              </sc-if>
              <sc-if value="{{r.isSeg}}" hint-placeholder-val="{{ false }}">
                <div role="group" aria-label="{{r.label}}" style="position: relative; flex-shrink: 0; height: 88px; padding: 8px; border-radius: 999px; background: #F1EDE7; display: flex">
                  <span aria-hidden="true" style="position: absolute; left: 8px; top: 8px; width: {{r.segW}}px; height: 72px; border-radius: 999px; background: #171513; transform: translateX({{r.segX}}px); transition: transform 500ms cubic-bezier(.3,1.15,.4,1); display: block"></span>
                  <sc-for list="{{r.opts}}" as="o" hint-placeholder-count="3">
                    <button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="position: relative; width: {{o.w}}px; height: 72px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 600; color: {{o.color}}; transition: color 300ms">{{o.label}}</button>
                  </sc-for>
                </div>
              </sc-if>
              <sc-if value="{{r.isAction}}" hint-placeholder-val="{{ false }}">
                <button onClick="{{r.act}}" class="press" style="flex-shrink: 0; height: 88px; padding: 0 36px; border-radius: 999px; background: {{r.btnBg}}; color: #FFFFFF; display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 600; transition: background-color 360ms cubic-bezier(.2,0,0,1), transform 140ms">
                  <sc-if value="{{r.busy}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" viewBox="0 0 24 24" style="width: 32px; height: 32px; animation: spin .9s linear infinite"><path d="M12 3a9 9 0 1 0 9 9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path></svg></sc-if>
                  <sc-if value="{{r.done}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" viewBox="0 0 24 24" style="width: 32px; height: 32px; animation: popIn 420ms cubic-bezier(.3,1.15,.4,1) both"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
                  {{r.btnLabel}}
                </button>
              </sc-if>
              <sc-if value="{{r.isInfo}}" hint-placeholder-val="{{ false }}">
                <span style="flex-shrink: 0; font-size: 28px; font-weight: 600; color: {{r.valColor}}; text-align: right">{{r.value}}</span>
              </sc-if>
              <sc-if value="{{r.isInput}}" hint-placeholder-val="{{ false }}">
                <input aria-label="{{r.label}}" value="{{r.value}}" onChange="{{r.change}}" style="flex-shrink: 0; width: 460px; height: 88px; border-radius: 28px; border: 2px solid transparent; background: #F1EDE7; padding: 0 28px; font-size: 28px; font-weight: 500; outline: none; transition: border-color 200ms, background-color 200ms">
              </sc-if>
              <sc-if value="{{r.isMeter}}" hint-placeholder-val="{{ false }}">
                <span style="flex-shrink: 0; display: flex; align-items: center; gap: 24px">
                  <span style="display: block; width: 280px; height: 12px; border-radius: 6px; background: #F1EDE7; overflow: hidden"><span style="display: block; height: 100%; width: {{r.pct}}%; border-radius: 6px; background: {{r.meterColor}}; transform-origin: left center; animation: grow 1100ms cubic-bezier(.16,1,.3,1) 450ms both"></span></span>
                  <span style="width: 84px; text-align: right; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums">{{r.pct}}%</span>
                </span>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8552B","options":["#C8552B","#2F5D4A","#3A4C7A","#171513"]},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.def = {
      pageTitle: 'Receipt printer',
      hero: { title: 'Thermal printer', sub: 'TP-80 · connected by USB · 80 mm paper', status: 'Ready', icon: 'M7 8V3h10v5M7 17H5a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M7 14h10v7H7z' },
      groups: [
        { title: 'Status', statusOf: true, rows: [
          { k: 'paper', type: 'meter', label: 'Paper roll', sub: 'Replace below 15%', pct: 68 },
          { k: 'last', type: 'info', label: 'Last printed', value: 'Order A246 · 2 min ago' },
          { k: 'test', type: 'action', label: 'Test page', sub: 'Prints a sample receipt', btn: 'Print test page', busyLabel: 'Printing…', doneLabel: 'Printed' },
          { k: 'feed', type: 'action', label: 'Feed paper', sub: 'Advances the roll by 5 cm', btn: 'Feed', busyLabel: 'Feeding…', doneLabel: 'Done' }
        ] },
        { title: 'Receipt', rows: [
          { k: 'receipt', type: 'toggle', label: 'Customer receipt', sub: 'Print automatically after payment', on: true },
          { k: 'kitchen', type: 'toggle', label: 'Kitchen ticket', sub: 'Send to the kitchen printer when paid', on: true },
          { k: 'logo', type: 'toggle', label: 'Logo on receipt', sub: 'Uses the restaurant logo from the menu system', on: true },
          { k: 'footer', type: 'input', label: 'Receipt footer', sub: 'Printed at the bottom', value: 'Thank you for dining with us!' }
        ] },
        { title: 'Paper', rows: [
          { k: 'width', type: 'seg', label: 'Paper width', opts: ['58 mm', '80 mm'], sel: 1, w: 150 },
          { k: 'density', type: 'seg', label: 'Print density', opts: ['Light', 'Normal', 'Dark'], sel: 1, w: 130 }
        ] }
      ]
    };
    const vals = {};
    this.def.groups.forEach((g) => g.rows.forEach((r) => {
      if (r.type === 'toggle') vals[r.k] = r.on;
      if (r.type === 'seg') vals[r.k] = r.sel;
      if (r.type === 'input') vals[r.k] = r.value;
    }));
    this.icons = {
      builtin: 'M7 8V3h10v5M7 17H5a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M7 14h10v7H7z',
      usb: 'M12 2v14M9 5l3-3 3 3M7 9v3l5 3M17 8v2l-5 3M12 22a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
      bt: 'M7 7l10 10-5 4V3l5 4L7 17'
    };
    this.catalog = {
      builtin: [{ id: 'imin', name: 'Built-in printer', model: 'iMin 80 mm', conn: 'Built-in' }],
      usb: [{ id: 'xp', name: 'Counter printer', model: 'Xprinter XP-Q80', conn: 'USB' }],
      bt: [{ id: 'tm', name: 'Kitchen printer', model: 'EPSON TM-m30', conn: 'Bluetooth' }, { id: 'rpp', name: 'Bar printer', model: 'RPP02N', conn: 'Bluetooth' }]
    };
    this.state = { vals, act: {}, printers: ['imin', 'tm'], roles: { receipt: 'imin', kitchen: 'tm' }, adding: false, justAdded: null };
    this.timers = [];
  }
  componentWillUnmount() { this.timers.forEach((t) => clearTimeout(t)); }
  find(id) {
    const all = [].concat(this.catalog.builtin, this.catalog.usb, this.catalog.bt);
    const p = all.find((x) => x.id === id);
    const kind = this.catalog.builtin.indexOf(p) >= 0 ? 'builtin' : (this.catalog.usb.indexOf(p) >= 0 ? 'usb' : 'bt');
    return Object.assign({ kind: kind }, p);
  }
  addPrinter(id) {
    if (this.state.printers.indexOf(id) >= 0) return;
    this.setState((s) => ({ printers: s.printers.concat([id]), justAdded: id }));
  }
  set(k, v) { this.setState((s) => ({ vals: Object.assign({}, s.vals, { [k]: v }) })); }
  run(k) {
    if (this.state.act[k] === 'busy') return;
    const setA = (v) => this.setState((s) => ({ act: Object.assign({}, s.act, { [k]: v }) }));
    setA('busy');
    this.timers.push(setTimeout(() => setA('done'), 1500));
    this.timers.push(setTimeout(() => setA('idle'), 3800));
  }
  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#C8552B';
    const d = this.def;
    const recName = this.find(s.roles.receipt).name;
    const roleDefs = [{ k: 'receipt', label: 'Receipt' }, { k: 'kitchen', label: 'Kitchen' }];
    const srcDefs = [
      { kind: 'builtin', title: 'Built-in', note: 'Detected on this kiosk' },
      { kind: 'usb', title: 'USB', note: '1 device attached' },
      { kind: 'bt', title: 'Bluetooth', note: 'Paired devices' }
    ];
    return {
      accent: accent,
      pageTitle: d.pageTitle,
      printers: s.printers.map((id, i) => {
        const p = this.find(id);
        return {
          name: p.name, model: p.model, conn: p.conn, status: 'Ready', icon: this.icons[p.kind],
          delay: id === s.justAdded ? 0 : 220 + i * 80,
          roles: roleDefs.map((r) => {
            const on = s.roles[r.k] === id;
            return {
              label: r.label, on: on,
              bg: on ? '#171513' : '#FFFFFF', fg: on ? '#FAF8F5' : '#171513', border: on ? '#171513' : '#E9E4DC',
              dotBg: on ? accent : 'transparent', dotBorder: on ? accent : '#D9D2C8',
              pick: () => { if (!on) this.setState((st) => ({ roles: Object.assign({}, st.roles, { [r.k]: id }) })); }
            };
          })
        };
      }),
      adding: s.adding,
      addLabel: s.adding ? 'Close' : 'Add printer',
      addRot: s.adding ? 45 : 0,
      toggleAdd: () => this.setState((st) => ({ adding: !st.adding })),
      sources: srcDefs.map((sd, i) => ({
        title: sd.title, note: sd.note, icon: this.icons[sd.kind], delay: 60 + i * 70,
        devices: this.catalog[sd.kind].map((p) => {
          const added = s.printers.indexOf(p.id) >= 0;
          return { name: p.model, detail: added ? 'In use as ' + p.name.toLowerCase() : 'Not set up yet', added: added, canAdd: !added, add: () => this.addPrinter(p.id) };
        })
      })),
      groups: d.groups.map((g, gi) => ({
        title: g.statusOf ? 'Status · ' + recName : g.title,
        delay: 320 + gi * 90,
        rows: g.rows.map((r, ri) => {
          const a = s.act[r.k] || 'idle';
          const v = s.vals[r.k];
          const w = Math.round((r.w || 130) * 1.2);
          return {
            label: r.label,
            sub: r.sub || '',
            hasSub: !!r.sub,
            line: ri < g.rows.length - 1 ? '2px solid #F1EDE7' : 'none',
            isToggle: r.type === 'toggle', isSeg: r.type === 'seg', isAction: r.type === 'action',
            isInfo: r.type === 'info', isInput: r.type === 'input', isMeter: r.type === 'meter',
            on: !!v,
            track: v ? '#2F7A50' : '#D9D2C8',
            x: v ? 52 : 0,
            segW: w,
            segX: (v || 0) * w,
            opts: (r.opts || []).map((label, oi) => ({ label, w: w, on: v === oi, color: v === oi ? '#FAF8F5' : '#171513', pick: () => this.set(r.k, oi) })),
            busy: a === 'busy',
            done: a === 'done',
            btnLabel: a === 'busy' ? r.busyLabel : (a === 'done' ? r.doneLabel : r.btn),
            btnBg: a === 'done' ? '#2F7A50' : '#171513',
            value: r.type === 'input' ? v : r.value,
            valColor: r.ok ? '#2F7A50' : '#171513',
            change: (e) => this.set(r.k, e && e.target ? e.target.value : v),
            pct: r.pct || 0,
            meterColor: (r.pct || 0) < 15 ? accent : '#2F7A50',
            act: r.type === 'toggle' ? () => this.set(r.k, !v) : () => this.run(r.k)
          };
        })
      }))
    };
  }
}
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo slot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes photoIn{0%{opacity:0;transform:scale(1.04)}100%{opacity:1;transform:none}}
@keyframes sheen{0%{transform:translateX(-120%) skewX(-12deg)}100%{transform:translateX(240%) skewX(-12deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>
</helmet>
<div style="position: relative; width: {{w}}px; height: {{h}}px; border-radius: {{radius}}px; overflow: hidden; background: {{tone}}; flex-shrink: 0; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif">
  <sc-if value="{{hasSrc}}" hint-placeholder-val="{{ false }}">
    <img src="{{src}}" alt="{{label}}" style="width: 100%; height: 100%; object-fit: {{fit}}; object-position: {{pos}}; display: block; animation: photoIn 900ms cubic-bezier(.16,1,.3,1) both">
  </sc-if>
  <sc-if value="{{noSrc}}" hint-placeholder-val="{{ true }}">
    <div role="img" aria-label="{{label}} photo" style="position: absolute; inset: 0">
      <sc-if value="{{showLabel}}" hint-placeholder-val="{{ true }}">
        <span style="position: absolute; left: {{pad}}px; bottom: {{pad}}px; font-size: 24px; font-weight: 500; color: #6F6961; opacity: .8">{{caption}}</span>
      </sc-if>
    </div>
  </sc-if>
  <span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.4) 50%, rgba(255,255,255,0) 100%); animation: sheen 1500ms cubic-bezier(.4,0,.2,1) 300ms both; pointer-events: none; display: block"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"src":{"editor":"text","default":""},"label":{"editor":"text","default":"Menu photo"},"caption":{"editor":"text","default":"Photo"},"w":{"editor":"int","default":480},"h":{"editor":"int","default":360},"radius":{"editor":"int","default":32},"tone":{"editor":"color","default":"#E9DED0"},"fit":{"editor":"enum","options":["cover","contain"],"default":"cover"},"pos":{"editor":"text","default":"center"},"plate":{"editor":"boolean","default":true},"$preview":{"width":480,"height":360}}'>
class Component extends DCLogic {
  renderVals() {
    const w = this.props.w ?? 480;
    const h = this.props.h ?? 360;
    const m = Math.min(w, h);
    const src = this.props.src ?? '';
    const raw = this.props.tone ?? '#E9DED0';
    let tone = '#E6DCD3';
    const hx = /^#([0-9a-f]{6})$/i.exec(raw);
    if (hx) {
      const n = parseInt(hx[1], 16);
      const lum = (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
      tone = lum < 0.7 ? '#E6DCD3' : raw;
    }
    return {
      w: w, h: h,
      radius: this.props.radius ?? 32,
      tone: tone,
      fit: this.props.fit ?? 'cover',
      pos: this.props.pos ?? 'center',
      src: src, hasSrc: !!src, noSrc: !src,
      label: this.props.label || 'Menu',
      caption: this.props.caption || 'Photo',
      showLabel: m >= 240 && (this.props.plate ?? true),
      pad: Math.max(20, Math.round(m * 0.07))
    };
  }
}
</script>
</body>
</html>

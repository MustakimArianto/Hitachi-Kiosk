<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hitachi Kiosk · Splash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F5}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
@keyframes markIn{0%{opacity:0;transform:scale(.6) rotate(-8deg)}100%{opacity:1;transform:none}}
@keyframes dotIn{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes ringOut{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.tile{transform-box:fill-box;transform-origin:center;animation:markIn 800ms cubic-bezier(.16,1,.3,1) 100ms both}
.base{transform-box:fill-box;transform-origin:center;animation:baseIn 600ms cubic-bezier(.16,1,.3,1) 450ms both}
.bell{transform-box:fill-box;transform-origin:50% 100%;animation:bellUp 700ms cubic-bezier(.3,1.25,.4,1) 650ms both}
.wave{transform-box:view-box;transform-origin:100px 138px;stroke-dasharray:1}
.w1{animation:draw 800ms cubic-bezier(.65,0,.35,1) 1100ms both, pulse 3600ms ease-in-out 4000ms infinite}
.w2{opacity:0;animation:echo 1400ms cubic-bezier(.16,1,.3,1) 1900ms both, echoLoop 3600ms cubic-bezier(.16,1,.3,1) 4000ms infinite}
@keyframes baseIn{0%{opacity:0;transform:scaleX(.2)}100%{opacity:1;transform:none}}
@keyframes bellUp{0%{opacity:0;transform:translateY(24px) scaleY(.4)}100%{opacity:1;transform:none}}
@keyframes draw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{transform:none}8%{transform:scale(1.04)}16%{transform:none}}
@keyframes echo{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
@keyframes echoLoop{0%{opacity:.5;transform:scale(1)}30%,100%{opacity:0;transform:scale(1.5)}}
@keyframes rise{0%{transform:translateY(105%)}100%{transform:none}}
@keyframes up{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
@keyframes fill{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
.rm *,.rm *::before,.rm *::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
</style>
</helmet>
<div class="{{rootClass}}" style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #FAF8F5; color: #171513; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 56px; margin-top: -80px">
    <div style="position: relative; width: 240px; height: 240px">
      <svg role="img" aria-label="Kiosk logo" viewBox="0 0 200 200" style="width: 100%; height: 100%; display: block; overflow: visible">
        <g class="tile"><rect width="200" height="200" rx="60" fill="#171513"></rect></g>
        <g class="bell">
          <path d="M40 138a60 60 0 0 1 120 0z" fill="#FAF8F5"></path>
        </g>
        <rect class="base" x="40" y="148" width="120" height="14" rx="7" fill="#FAF8F5"></rect>
        <path class="wave w1" pathLength="1" d="M41.8 89.1A76 76 0 0 1 158.2 89.1" fill="none" stroke="{{accent}}" stroke-width="11" stroke-linecap="round"></path>
        <path class="wave w2" pathLength="1" d="M41.8 89.1A76 76 0 0 1 158.2 89.1" fill="none" stroke="{{accent}}" stroke-width="9" stroke-linecap="round"></path>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 24px">
      <div style="overflow: hidden; padding: 0 8px 12px">
        <h1 style="margin: 0; font-size: 112px; line-height: .98; letter-spacing: -0.035em; font-weight: 800; display: flex; gap: 28px">
          <span style="display: inline-block; animation: rise 900ms cubic-bezier(.16,1,.3,1) 900ms both">Hitachi</span>
          <span style="display: inline-block; color: #6F6961; font-weight: 500; animation: rise 900ms cubic-bezier(.16,1,.3,1) 1000ms both">Kiosk</span>
        </h1>
      </div>
      <p style="margin: 0; font-size: 30px; font-weight: 500; color: #6F6961; animation: up 800ms cubic-bezier(.16,1,.3,1) 1350ms both">Self-ordering for restaurants</p>
    </div>
    <div aria-hidden="true" style="width: 360px; height: 6px; border-radius: 3px; background: #E9E4DC; overflow: hidden; animation: fade 500ms ease 1500ms both">
      <span style="display: block; height: 100%; background: {{accent}}; transform-origin: left; animation: fill 2200ms cubic-bezier(.65,0,.35,1) 1600ms both"></span>
    </div>
  </div>

  <p style="position: absolute; left: 0; right: 0; bottom: 96px; margin: 0; text-align: center; font-size: 24px; font-weight: 500; color: #6F6961; animation: fade 600ms ease 1700ms both">Preparing your kiosk</p>

  <a ref="{{setLink}}" href="Login.dc.html" aria-hidden="true" tabindex="-1" style="position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8552B","options":["#C8552B","#2F5D4A","#3A4C7A","#171513"]},"brand":{"editor":"text","default":"Urban Grill"},"reduceMotion":{"editor":"boolean","default":false},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.t = setTimeout(() => { if (this.link) this.link.click(); }, 4100);
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    return {
      rootClass: this.props.reduceMotion ? 'rm' : '',
      accent: this.props.accent ?? '#C8552B',
      brand: this.props.brand ?? 'Urban Grill',
      setLink: (el) => { this.link = el; }
    };
  }
}
</script>
</body>
</html>

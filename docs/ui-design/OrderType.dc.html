<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hitachi Kiosk · Dine in or takeaway</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F5}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2{text-wrap:balance}
p{text-wrap:pretty}
.press{transition:transform 140ms cubic-bezier(.2,0,0,1)}
.press:active{transform:scale(.97)}
@keyframes heroIn{0%{opacity:0;transform:scale(1.05)}100%{opacity:1;transform:none}}
@keyframes rise{0%{transform:translateY(105%)}100%{transform:none}}
@keyframes up{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
@keyframes fade{0%{opacity:0}100%{opacity:1}}
@keyframes cardIn{0%{opacity:0;transform:translateY(72px)}100%{opacity:1;transform:none}}
@keyframes fill{0%{clip-path:circle(0% at 20% 30%)}100%{clip-path:circle(160% at 20% 30%)}}
@keyframes popIn{0%{opacity:0;transform:scale(.4) rotate(-30deg)}70%{opacity:1;transform:scale(1.1)}100%{transform:none}}
@keyframes lift{0%{transform:none}40%{transform:translateY(-10px)}100%{transform:none}}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
.rm *,.rm *::before,.rm *::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
</style>
</helmet>
<div class="{{rootClass}}" style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #FAF8F5; color: #171513; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif">

  <header style="position: absolute; left: 72px; right: 72px; top: 48px; height: 96px; display: flex; align-items: center; justify-content: space-between; z-index: 2; animation: fade 600ms ease both">
    <span style="display: flex; align-items: center; gap: 20px; font-size: 34px; font-weight: 700; letter-spacing: -0.01em">
      <span style="width: 80px; height: 80px; border-radius: 24px; background: #171513; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; border-radius: 50%; background: {{accent}}; display: block"></span></span>
      {{brand}}
    </span>
    <div role="group" aria-label="Language" style="position: relative; display: flex; height: 96px; padding: 8px; border-radius: 48px; background: #F1EDE7">
      <span aria-hidden="true" style="position: absolute; left: 8px; top: 8px; width: 168px; height: 80px; border-radius: 40px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.05); transform: translateX({{langX}}px); transition: transform 500ms cubic-bezier(.3,1.15,.4,1); display: block"></span>
      <button class="press" onClick="{{setEN}}" aria-pressed="{{isEN}}" style="position: relative; width: 168px; height: 80px; border-radius: 40px; font-size: 28px; font-weight: 600; color: {{enColor}}; transition: color 260ms">English</button>
      <button class="press" onClick="{{setID}}" aria-pressed="{{isID}}" style="position: relative; width: 168px; height: 80px; border-radius: 40px; font-size: 28px; font-weight: 600; color: {{idColor}}; transition: color 260ms">Bahasa</button>
    </div>
  </header>

  <main style="position: absolute; left: 72px; right: 72px; top: 216px; display: flex; flex-direction: column">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <div style="overflow: hidden"><p style="margin: 0; font-size: 26px; font-weight: 500; color: #6F6961; animation: rise 700ms cubic-bezier(.16,1,.3,1) 80ms both">{{welcome}}</p></div>
      <div style="overflow: hidden; padding-bottom: 8px"><h1 style="margin: 0; font-size: 96px; line-height: .98; letter-spacing: -0.035em; font-weight: 800; white-space: nowrap; animation: rise 900ms cubic-bezier(.16,1,.3,1) 140ms both">{{brand}}</h1></div>
    </div>

    <div aria-hidden="true" style="margin-top: 48px; height: 520px; border-radius: 40px; overflow: hidden; animation: heroIn 1100ms cubic-bezier(.16,1,.3,1) 160ms both">
      <dc-import name="Photo" src="{{heroImg}}" label="Restaurant" caption="Restaurant photo" tone="#E3D4C2" w="{{ 936 }}" h="{{ 520 }}" radius="{{ 40 }}" hint-size="936px,520px"></dc-import>
    </div>

    <h2 style="margin: 64px 0 32px; font-size: 44px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; animation: up 700ms cubic-bezier(.16,1,.3,1) 260ms both">{{question}}</h2>

    <div role="radiogroup" aria-label="Order type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
        <div style="animation: cardIn 900ms cubic-bezier(.16,1,.3,1) {{o.delay}}ms both">
          <button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" class="press" style="position: relative; width: 100%; height: 640px; border-radius: 40px; background: #FFFFFF; color: {{o.fg}}; overflow: hidden; display: flex; flex-direction: column; text-align: left; box-shadow: 0 0 0 2px #E9E4DC; opacity: {{o.opacity}}; transition: opacity 300ms, transform 140ms">
            <span style="position: relative; display: block; width: 456px; height: 300px; flex: none">
              <dc-import name="Photo" src="" label="{{o.title}}" caption="{{o.caption}}" tone="{{o.tone}}" w="{{ 456 }}" h="{{ 300 }}" radius="{{ 0 }}" hint-size="456px,300px"></dc-import>
            </span>
            <span style="position: relative; flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 32px 36px 36px">
              <sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}">
                <span aria-hidden="true" style="position: absolute; inset: 0; background: {{accent}}; animation: fill 600ms cubic-bezier(.16,1,.3,1) both; display: block"></span>
              </sc-if>
              <span style="position: relative; width: 88px; height: 88px; border-radius: 28px; background: {{o.iconBg}}; display: flex; align-items: center; justify-content: center; transition: background-color 300ms; {{o.iconAnim}}">
                <sc-if value="{{o.isDine}}" hint-placeholder-val="{{ true }}">
                  <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 48px; height: 48px"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 0-3.5 2.5-3.5 6v4H17" fill="none" stroke="{{o.iconFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </sc-if>
                <sc-if value="{{o.isTake}}" hint-placeholder-val="{{ false }}">
                  <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 48px; height: 48px"><path d="M5 8h14l-1.2 12.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8zM9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="{{o.iconFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </sc-if>
              </span>
              <span style="position: relative; display: flex; flex-direction: column; gap: 12px">
                <span style="font-size: 48px; font-weight: 700; letter-spacing: -0.025em; line-height: 1">{{o.title}}</span>
                <span style="font-size: 28px; line-height: 1.35; font-weight: 400; color: {{o.sub}}">{{o.desc}}</span>
              </span>
            </span>
            <sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}">
              <span aria-hidden="true" style="position: absolute; right: 28px; top: 28px; width: 88px; height: 88px">
                <span style="position: absolute; inset: 0; border-radius: 50%; border: 3px solid {{accent}}; animation: ring 800ms cubic-bezier(.2,0,0,1) 200ms both; display: block"></span>
                <span style="position: absolute; inset: 0; border-radius: 50%; background: {{accent}}; display: flex; align-items: center; justify-content: center; animation: popIn 500ms cubic-bezier(.3,1.15,.4,1) 150ms both">
                  <svg viewBox="0 0 24 24" style="width: 44px; height: 44px"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </span>
              </span>
            </sc-if>
          </button>
        </div>
      </sc-for>
    </div>
  </main>

  <p style="position: absolute; left: 0; right: 0; bottom: 56px; margin: 0; text-align: center; font-size: 24px; font-weight: 500; color: #6F6961; animation: fade 600ms ease 900ms both">Powered by Hitachi Kiosk</p>
  <a ref="{{setLink}}" href="Menu.dc.html" aria-hidden="true" tabindex="-1" style="position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0">Menu</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8552B","options":["#C8552B","#2F5D4A","#3A4C7A","#171513"]},"brand":{"editor":"text","default":"Urban Grill"},"reduceMotion":{"editor":"boolean","default":false},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.IMG = { hero: '' };
    this.state = { picked: null, lang: 'EN' };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  pick(id) {
    if (this.state.picked) return;
    this.setState({ picked: id });
    this.t = setTimeout(() => { if (this.link) this.link.click(); }, 950);
  }
  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#C8552B';
    const brand = this.props.brand ?? 'Urban Grill';
    const en = s.lang === 'EN';
    const defs = [
      { id: 'dine', title: en ? 'Dine in' : 'Makan di sini', desc: en ? 'Served on a tray. We’ll call your number.' : 'Disajikan di nampan. Nomor Anda akan dipanggil.', caption: 'Dining room photo', tone: '#E9DED0' },
      { id: 'take', title: en ? 'Takeaway' : 'Bawa pulang', desc: en ? 'Packed in a sealed bag, ready to go.' : 'Dikemas dalam kantong tertutup.', caption: 'Takeaway bag photo', tone: '#EADCCB' }
    ];
    return {
      rootClass: this.props.reduceMotion ? 'rm' : '',
      accent: accent,
      brand: brand,
      heroImg: this.IMG.hero,
      welcome: en ? 'Welcome to' : 'Selamat datang di',
      question: en ? 'Where are you eating today?' : 'Mau makan di mana hari ini?',
      setLink: (el) => { this.link = el; },
      opts: defs.map((d, i) => {
        const on = s.picked === d.id;
        return {
          ...d,
          on: on,
          isDine: d.id === 'dine',
          isTake: d.id === 'take',
          delay: 360 + i * 80,
          fg: on ? '#FFFFFF' : '#171513',
          sub: on ? 'rgba(255,255,255,.9)' : '#6F6961',
          iconBg: on ? 'rgba(255,255,255,.2)' : '#F1EDE7',
          iconFg: on ? '#FFFFFF' : '#171513',
          iconAnim: on ? 'animation: lift 600ms cubic-bezier(.16,1,.3,1) 120ms both' : '',
          opacity: s.picked && !on ? .45 : 1,
          pick: () => this.pick(d.id)
        };
      }),
      isEN: en,
      isID: !en,
      langX: en ? 0 : 168,
      enColor: en ? '#171513' : '#6F6961',
      idColor: en ? '#6F6961' : '#171513',
      setEN: () => this.setState({ lang: 'EN' }),
      setID: () => this.setState({ lang: 'ID' })
    };
  }
}
</script>
</body>
</html>

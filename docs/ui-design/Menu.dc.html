<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hitachi Kiosk · Menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F5}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
h1,h2{text-wrap:balance}
.press{transition:transform 140ms cubic-bezier(.2,0,0,1)}
.press:active{transform:scale(.96)}
.lift{transition:transform 220ms cubic-bezier(.2,0,0,1)}
.lift:active{transform:scale(.985)}
.scroller{scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
@keyframes titleRise{0%{transform:translateY(105%)}100%{transform:none}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
@keyframes cardA{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
@keyframes cardB{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}
@keyframes headA{0%{opacity:0;transform:translateY(60%)}100%{opacity:1;transform:none}}
@keyframes headB{0%{opacity:0;transform:translateY(60%)}100%{opacity:1;transform:none}}
@keyframes kbA{0%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes kbB{0%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes promoA{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:none}}
@keyframes promoB{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:none}}
@keyframes progA{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes progB{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pillIn{0%{opacity:0;transform:translateX(32px)}100%{opacity:1;transform:none}}
@keyframes checkIn{0%{opacity:0;transform:scale(.4) rotate(-45deg)}100%{opacity:1;transform:none}}
@keyframes ringOut{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@keyframes bumpA{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes bumpB{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes rollA{0%{opacity:0;transform:translateY(60%)}100%{opacity:1;transform:none}}
@keyframes rollB{0%{opacity:0;transform:translateY(60%)}100%{opacity:1;transform:none}}
@keyframes flyA{0%{opacity:1;transform:translate(0,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
@keyframes flyB{0%{opacity:1;transform:translate(0,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
@keyframes thumbIn{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:none}}
@keyframes dockIn{0%{transform:translateY(140%)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
.rm *,.rm *::before,.rm *::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
</style>
</helmet>
<div ref="{{setRoot}}" class="{{rootClass}}" style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #FAF8F5; color: #171513; font-family: 'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif">

  <header style="position: absolute; left: 72px; right: 72px; top: 48px; height: 96px; display: flex; align-items: center; justify-content: space-between; z-index: 3; animation: fadeIn 500ms cubic-bezier(.16,1,.3,1) both">
    <div style="display: flex; align-items: center; gap: 20px">
      <span aria-hidden="true" style="width: 80px; height: 80px; border-radius: 24px; background: #171513; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; border-radius: 50%; background: {{accent}}; display: block"></span></span>
      <span style="font-size: 34px; font-weight: 700; letter-spacing: -.5px">{{brand}}</span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px">
      <a href="OrderType.dc.html" class="press" style="height: 96px; padding: 0 12px 0 32px; border-radius: 999px; border: 2px solid #E9E4DC; display: flex; align-items: center; gap: 18px; font-size: 28px; font-weight: 600; color: #6F6961">
        Dine in
        <span style="height: 72px; padding: 0 26px; border-radius: 999px; background: #F1EDE7; color: #171513; display: flex; align-items: center; font-size: 26px; font-weight: 600">Change</span>
      </a>
      <a href="Idle.dc.html" class="press" style="height: 96px; padding: 0 34px; border-radius: 999px; border: 2px solid #E9E4DC; display: flex; align-items: center; font-size: 28px; font-weight: 600; color: #171513">Cancel</a>
    </div>
  </header>

  <div style="position: absolute; left: 72px; right: 72px; top: 208px">
    <p style="margin: 0 0 12px; font-size: 26px; font-weight: 500; color: #6F6961; animation: fadeUp 700ms cubic-bezier(.16,1,.3,1) 80ms both">Good afternoon</p>
    <div style="overflow: hidden; padding-bottom: 6px"><h1 style="margin: 0; font-size: 80px; font-weight: 700; letter-spacing: -2.4px; line-height: 1.0; animation: titleRise 900ms cubic-bezier(.16,1,.3,1) 80ms both">What are you having?</h1></div>
  </div>

  <nav aria-label="Categories" class="scroller" style="position: absolute; left: 0; right: 0; top: 400px; height: 112px; overflow-x: auto; z-index: 2">
    <div style="display: flex; gap: 12px; padding: 8px 72px; width: max-content">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
        <sc-if value="{{c.isLink}}" hint-placeholder-val="{{ false }}">
          <a href="Combo.dc.html" class="press" style="height: 96px; padding: 0 32px 0 40px; border-radius: 999px; background: #F1EDE7; display: flex; align-items: center; gap: 10px; font-size: 30px; font-weight: 600; white-space: nowrap; animation: pillIn 600ms cubic-bezier(.16,1,.3,1) {{c.delay}}ms backwards">
            {{c.label}}
            <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 28px; height: 28px"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="#6F6961" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </a>
        </sc-if>
        <sc-if value="{{c.isBtn}}" hint-placeholder-val="{{ true }}">
          <button onClick="{{c.pick}}" aria-current="{{c.active}}" class="press" style="height: 96px; padding: 0 40px; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; font-size: 30px; font-weight: 600; white-space: nowrap; transition: background-color 420ms cubic-bezier(.16,1,.3,1), color 420ms, transform 140ms; animation: pillIn 600ms cubic-bezier(.16,1,.3,1) {{c.delay}}ms backwards">{{c.label}}</button>
        </sc-if>
      </sc-for>
    </div>
  </nav>

  <main ref="{{setScroll}}" class="scroller" style="position: absolute; left: 0; right: 0; top: 528px; bottom: 0; overflow-y: auto; padding: 24px 72px 264px">
    <sc-if value="{{isFeatured}}" hint-placeholder-val="{{ true }}">
      <div style="position: relative; height: 400px; border-radius: 40px; overflow: hidden; background: #FFFFFF; display: flex; margin-bottom: 64px; border: 2px solid #EFE9E0; animation: fadeUp 700ms cubic-bezier(.16,1,.3,1) 160ms both">
        <div style="position: relative; flex: 1; min-width: 0; padding: 44px 40px 36px 44px; display: flex; flex-direction: column">
          <span style="align-self: flex-start; padding: 8px 18px; border-radius: 999px; background: #F1EDE7; color: {{accent}}; font-size: 24px; font-weight: 700; animation: {{promoAnim}} 560ms cubic-bezier(.16,1,.3,1) both">{{promo.tag}}</span>
          <span style="margin-top: 20px; font-size: 60px; font-weight: 800; letter-spacing: -1.8px; white-space: nowrap; line-height: 1.0; animation: {{promoAnim}} 620ms cubic-bezier(.16,1,.3,1) 60ms both">{{promo.title}}</span>
          <span style="margin-top: 12px; font-size: 30px; font-weight: 600; color: #6F6961; animation: {{promoAnim}} 620ms cubic-bezier(.16,1,.3,1) 120ms both">{{promo.price}}</span>
          <div style="margin-top: auto; display: flex; align-items: center; gap: 28px">
            <a href="{{promo.href}}" class="press" style="height: 88px; padding: 0 34px; border-radius: 999px; background: #171513; color: #FAF8F5; display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 700; white-space: nowrap">Order now<svg aria-hidden="true" viewBox="0 0 24 24" style="width: 30px; height: 30px"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="#FAF8F5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
            <div style="display: flex; gap: 4px">
              <sc-for list="{{promoDots}}" as="d" hint-placeholder-count="3">
                <button onClick="{{d.go}}" aria-label="{{d.label}}" style="width: 44px; height: 48px; display: flex; align-items: center"><span style="display: block; width: 36px; height: 6px; border-radius: 3px; background: #E9E4DC; overflow: hidden"><span style="display: block; width: 100%; height: 100%; background: #171513; transform-origin: left; {{d.fill}}"></span></span></button>
              </sc-for>
            </div>
          </div>
        </div>
        <div style="position: relative; width: 380px; height: 396px; flex-shrink: 0; overflow: hidden">
          <sc-for list="{{promos}}" as="pr" hint-placeholder-count="3">
            <div style="position: absolute; inset: 0; opacity: {{pr.opacity}}; transition: opacity 1000ms cubic-bezier(.4,0,.2,1)">
              <div style="{{pr.kb}}"><dc-import name="Photo" src="{{pr.img}}" label="{{pr.photoLabel}}" tone="{{pr.tone}}" w="{{ 380 }}" h="{{ 396 }}" radius="{{ 0 }}" hint-size="380px,396px"></dc-import></div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 32px; overflow: hidden">
      <h2 style="margin: 0; font-size: 44px; font-weight: 700; letter-spacing: -.9px; line-height: 1.15; animation: {{headAnim}} 620ms cubic-bezier(.16,1,.3,1) both">{{sectionTitle}}</h2>
      <span style="font-size: 26px; font-weight: 500; color: #6F6961">{{countLabel}}</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
      <sc-for list="{{cards}}" as="p" hint-placeholder-count="4">
        <article class="lift" style="position: relative; border-radius: 40px; background: #FFFFFF; padding: 16px 16px 24px; display: flex; flex-direction: column; border: 2px solid #EFE9E0; animation: {{p.anim}} 700ms cubic-bezier(.16,1,.3,1) {{p.delay}}ms backwards">
          <a href="ItemDetail.dc.html" style="position: relative; display: flex; flex-direction: column">
            <dc-import name="Photo" src="{{p.img}}" label="" tone="{{p.tone}}" w="{{ 420 }}" h="{{ 300 }}" radius="{{ 32 }}" hint-size="420px,300px"></dc-import>
            <sc-if value="{{p.hasBadge}}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; left: 20px; top: 20px; padding: 8px 18px; border-radius: 999px; background: #FFFFFF; color: {{p.badgeFg}}; font-size: 24px; font-weight: 700">{{p.badge}}</span>
            </sc-if>
            <span style="padding: 24px 12px 0; display: flex; flex-direction: column; gap: 6px; min-height: 140px">
              <span style="font-size: 34px; font-weight: 600; line-height: 1.15; letter-spacing: -.4px">{{p.name}}</span>
              <span style="font-size: 26px; font-weight: 500; color: #6F6961">{{p.kcal}} kcal</span>
            </span>
          </a>
          <div style="margin-top: 16px; display: flex; align-items: center; justify-content: space-between; padding-left: 12px">
            <span style="font-size: 34px; font-weight: 700; letter-spacing: -.3px">{{p.priceFmt}}</span>
            <button onClick="{{p.add}}" aria-label="Add {{p.name}}" class="press" style="position: relative; width: 96px; height: 96px; border-radius: 50%; background: {{p.btnBg}}; display: flex; align-items: center; justify-content: center; transition: background-color 320ms cubic-bezier(.16,1,.3,1), transform 140ms">
              <sc-if value="{{p.added}}" hint-placeholder-val="{{ false }}">
                <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 3px solid {{accent}}; animation: ringOut 700ms cubic-bezier(.2,0,0,1) both"></span>
                <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 44px; height: 44px; animation: checkIn 420ms cubic-bezier(.3,1.4,.5,1) both"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </sc-if>
              <sc-if value="{{p.notAdded}}" hint-placeholder-val="{{ true }}">
                <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 42px; height: 42px"><path d="M12 5v14M5 12h14" fill="none" stroke="#171513" stroke-width="2.2" stroke-linecap="round"></path></svg>
              </sc-if>
            </button>
          </div>
        </article>
      </sc-for>
    </div>
  </main>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 320px; background: linear-gradient(180deg, rgba(250,248,245,0) 0%, #FAF8F5 55%); pointer-events: none; z-index: 3"></div>

  <sc-if value="{{flying}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; left: {{fly.x}}px; top: {{fly.y}}px; width: 180px; height: 140px; border-radius: 32px; overflow: hidden; box-shadow: 0 24px 48px rgba(23,21,19,.18); pointer-events: none; z-index: 6; --dx: {{fly.dx}}px; --dy: {{fly.dy}}px; animation: {{flyAnim}} 760ms cubic-bezier(.55,0,.75,.2) both">
      <dc-import name="Photo" src="{{fly.img}}" label="" tone="{{fly.tone}}" w="{{ 180 }}" h="{{ 140 }}" radius="{{ 32 }}" hint-size="180px,140px"></dc-import>
    </div>
  </sc-if>

  <section aria-label="Your order" style="position: absolute; left: 72px; right: 72px; bottom: 48px; height: 168px; border-radius: 48px; background: #171513; color: #FAF8F5; padding: 0 16px 0 28px; display: flex; align-items: center; gap: 20px; box-shadow: 0 24px 48px rgba(23,21,19,.10); z-index: 4; animation: dockIn 800ms cubic-bezier(.16,1,.3,1) 300ms both">
    <div style="display: flex; align-items: center; padding-right: 24px">
      <sc-for list="{{thumbs}}" as="t" hint-placeholder-count="3">
        <span style="display: block; margin-right: -24px; border-radius: 50%; border: 4px solid #171513; animation: thumbIn 480ms cubic-bezier(.3,1.4,.5,1) both">
          <dc-import name="Photo" src="{{t.img}}" label="" tone="{{t.tone}}" w="{{ 88 }}" h="{{ 88 }}" radius="{{ 44 }}" hint-size="88px,88px"></dc-import>
        </span>
      </sc-for>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; padding-left: 8px">
      <span style="font-size: 26px; font-weight: 500; color: #B9B2A8; display: inline-block; transform-origin: left; animation: {{bumpAnim}}">{{countLabel2}}</span>
      <span style="height: 56px; overflow: hidden; display: block"><span style="display: inline-block; font-size: 44px; font-weight: 700; line-height: 56px; letter-spacing: -.8px; animation: {{rollAnim}}">{{totalFmt}}</span></span>
    </div>
    <a ref="{{setCart}}" href="Payment.dc.html" class="press" style="height: 136px; padding: 0 40px 0 44px; border-radius: 36px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 700; white-space: nowrap; animation: {{ctaAnim}}">
      View order
      <svg aria-hidden="true" viewBox="0 0 24 24" style="width: 40px; height: 40px"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8552B","options":["#C8552B","#2F5D4A","#3A4C7A","#171513"]},"brand":{"editor":"text","default":"Urban Grill"},"reduceMotion":{"editor":"boolean","default":false},"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const IMG = {
      burger: '', double: '', chickenburger: '', bbq: '', chicken: '', wings: '', nuggets: '', bucket: '',
      bowl: '', teriyaki: '', geprek: '', beefbowl: '', fries: '', cheesefries: '', cola: '', icedtea: '',
      coffee: '', water: '', sundae: '', chocosundae: '', pandan: '', meal: ''
    };
    const T = { burgers: '#E9DED0', chicken: '#E3D4C2', bowls: '#EADCCB', sides: '#E6DCD3', drinks: '#DFE3DC', desserts: '#EADCCB' };
    this.T = T;
    this.cats = [
      { id: 'featured', label: 'Popular', img: IMG.double, tone: '#E9DED0' },
      { id: 'burgers', label: 'Burgers', img: IMG.burger, tone: T.burgers },
      { id: 'chicken', label: 'Chicken', img: IMG.chicken, tone: T.chicken },
      { id: 'bowls', label: 'Rice bowls', img: IMG.bowl, tone: T.bowls },
      { id: 'combos', label: 'Meals', img: IMG.meal, link: true },
      { id: 'sides', label: 'Sides', img: IMG.fries, tone: T.sides },
      { id: 'drinks', label: 'Drinks', img: IMG.icedtea, tone: T.drinks },
      { id: 'desserts', label: 'Desserts', img: IMG.sundae, tone: T.desserts }
    ];
    this.products = [
      { id: 'b1', cat: 'burgers', name: 'Classic Cheeseburger', price: 38000, kcal: 540, img: IMG.burger },
      { id: 'b2', cat: 'burgers', name: 'Smoky Double Burger', price: 52000, kcal: 780, img: IMG.double, badge: 'New' },
      { id: 'b3', cat: 'burgers', name: 'Hot Honey Chicken Burger', price: 42000, kcal: 620, img: IMG.chickenburger, badge: 'Spicy' },
      { id: 'b4', cat: 'burgers', name: 'BBQ Beef Bacon Burger', price: 45000, kcal: 710, img: IMG.bbq },
      { id: 'c1', cat: 'chicken', name: 'Crispy Chicken (2 pc)', price: 38000, kcal: 560, img: IMG.chicken, badge: 'Best seller' },
      { id: 'c2', cat: 'chicken', name: 'Spicy Wings (6 pc)', price: 36000, kcal: 480, img: IMG.wings, badge: 'Spicy' },
      { id: 'c3', cat: 'chicken', name: 'Chicken Nuggets (9 pc)', price: 32000, kcal: 430, img: IMG.nuggets },
      { id: 'c4', cat: 'chicken', name: 'Family Bucket (8 pc)', price: 129000, kcal: 2240, img: IMG.bucket, badge: 'Share' },
      { id: 'r1', cat: 'bowls', name: 'Sambal Matah Rice Bowl', price: 34000, kcal: 610, img: IMG.bowl, badge: 'Local' },
      { id: 'r2', cat: 'bowls', name: 'Teriyaki Chicken Bowl', price: 32000, kcal: 590, img: IMG.teriyaki },
      { id: 'r3', cat: 'bowls', name: 'Ayam Geprek Bowl', price: 30000, kcal: 640, img: IMG.geprek, badge: 'Spicy' },
      { id: 'r4', cat: 'bowls', name: 'Black Pepper Beef Bowl', price: 39000, kcal: 660, img: IMG.beefbowl },
      { id: 's1', cat: 'sides', name: 'French Fries (Regular)', price: 18000, kcal: 320, img: IMG.fries },
      { id: 's2', cat: 'sides', name: 'Cheese Fries', price: 26000, kcal: 450, img: IMG.cheesefries },
      { id: 's3', cat: 'sides', name: 'Chicken Nuggets (4 pc)', price: 16000, kcal: 190, img: IMG.nuggets },
      { id: 's4', cat: 'sides', name: 'Spicy Wings (3 pc)', price: 19000, kcal: 240, img: IMG.wings },
      { id: 'd1', cat: 'drinks', name: 'Iced Lychee Tea', price: 16000, kcal: 140, img: IMG.icedtea },
      { id: 'd2', cat: 'drinks', name: 'Cola (Regular)', price: 14000, kcal: 150, img: IMG.cola },
      { id: 'd3', cat: 'drinks', name: 'Iced Coffee Latte', price: 18000, kcal: 180, img: IMG.coffee },
      { id: 'd4', cat: 'drinks', name: 'Mineral Water 600 ml', price: 8000, kcal: 0, img: IMG.water },
      { id: 'e1', cat: 'desserts', name: 'Caramel Sundae', price: 15000, kcal: 330, img: IMG.sundae },
      { id: 'e2', cat: 'desserts', name: 'Chocolate Sundae', price: 15000, kcal: 350, img: IMG.chocosundae },
      { id: 'e3', cat: 'desserts', name: 'Pandan Soft Serve', price: 12000, kcal: 210, img: IMG.pandan, badge: 'Local' }
    ].map((x) => Object.assign(x, { tone: T[x.cat] }));
    this.featured = ['b2', 'c1', 'r1', 'd1'];
    this.promos = [
      { tag: 'New', title: 'Smoky Double', price: 'Rp 52.000', img: IMG.double, tone: '#E9DED0', photoLabel: 'Promo photo', href: 'ItemDetail.dc.html' },
      { tag: 'Meal deal', title: 'Burger Meal', price: 'Only Rp 56.000', img: IMG.meal, tone: '#E3D4C2', photoLabel: 'Promo photo', href: 'Combo.dc.html' },
      { tag: 'Share it', title: 'Family Bucket', price: '8 pc · Rp 129.000', img: IMG.bucket, tone: '#EADCCB', photoLabel: 'Promo photo', href: 'ItemDetail.dc.html' }
    ];
    this.state = {
      cat: 'featured', catTick: 0, promo: 0, promoTick: 0,
      cart: [
        { key: 'c1', price: 38000, qty: 1, img: IMG.chicken, tone: T.chicken },
        { key: 's1L', price: 22000, qty: 1, img: IMG.fries, tone: T.sides },
        { key: 'd1', price: 16000, qty: 2, img: IMG.icedtea, tone: T.drinks }
      ],
      cartTick: 0, justAdded: null, fly: null
    };
  }
  componentDidMount() { this.pt = setInterval(() => this.setState((s) => ({ promo: (s.promo + 1) % 3, promoTick: s.promoTick + 1 })), 5000); }
  componentWillUnmount() { clearInterval(this.pt); clearTimeout(this.t1); clearTimeout(this.t2); }
  goPromo(i) {
    clearInterval(this.pt);
    this.setState((s) => ({ promo: i, promoTick: s.promoTick + 1 }));
    this.pt = setInterval(() => this.setState((s) => ({ promo: (s.promo + 1) % 3, promoTick: s.promoTick + 1 })), 5000);
  }
  fmt(n) { return 'Rp ' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  pickCat(id) {
    if (id === this.state.cat) return;
    if (this.scrollEl) this.scrollEl.scrollTop = 0;
    this.setState((s) => ({ cat: id, catTick: s.catTick + 1 }));
  }
  add(p, e) {
    let fly = null;
    try {
      const card = e && e.currentTarget && e.currentTarget.closest('article');
      if (card && this.rootEl) {
        const rr = this.rootEl.getBoundingClientRect();
        const k = rr.width / 1080;
        const cr = card.getBoundingClientRect();
        const x = (cr.left - rr.left) / k + 130;
        const y = (cr.top - rr.top) / k + 90;
        let tx = 200, ty = 1790;
        if (this.cartEl) { const c = this.cartEl.getBoundingClientRect(); tx = (c.left - rr.left) / k - 120; ty = (c.top - rr.top) / k + 68; }
        fly = { x: Math.round(x), y: Math.round(y), dx: Math.round(tx - (x + 90)), dy: Math.round(ty - (y + 70)), img: p.img, tone: p.tone };
      }
    } catch (err) { fly = null; }
    this.setState((s) => {
      const cart = s.cart.map((l) => ({ ...l }));
      const line = cart.find((l) => l.key === p.id);
      if (line) line.qty += 1; else cart.push({ key: p.id, price: p.price, qty: 1, img: p.img, tone: p.tone });
      return { cart, cartTick: s.cartTick + 1, justAdded: p.id, fly };
    });
    clearTimeout(this.t1); clearTimeout(this.t2);
    this.t1 = setTimeout(() => this.setState({ justAdded: null }), 1400);
    this.t2 = setTimeout(() => this.setState({ fly: null }), 800);
  }
  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#C8552B';
    const brand = this.props.brand ?? 'Urban Grill';
    const p = s.catTick % 2 ? 'B' : 'A';
    const pp = s.promoTick % 2 ? 'B' : 'A';
    const cp = s.cartTick % 2 ? 'B' : 'A';
    const idx = this.cats.findIndex((c) => c.id === s.cat);
    const list = s.cat === 'featured' ? this.featured.map((id) => this.products.find((x) => x.id === id)) : this.products.filter((x) => x.cat === s.cat);
    const count = s.cart.reduce((a, l) => a + l.qty, 0);
    const total = s.cart.reduce((a, l) => a + l.qty * l.price, 0);
    return {
      rootClass: this.props.reduceMotion ? 'rm' : '',
      setRoot: (el) => { this.rootEl = el; },
      setScroll: (el) => { this.scrollEl = el; },
      setCart: (el) => { this.cartEl = el; },
      accent: accent,
      brand: brand,
      cats: this.cats.map((c, i) => {
        const on = c.id === s.cat;
        return {
          ...c,
          isLink: !!c.link,
          isBtn: !c.link,
          active: on,
          delay: 160 + i * 50,
          bg: on ? '#171513' : '#F1EDE7',
          fg: on ? '#FAF8F5' : '#171513',
          pick: () => this.pickCat(c.id)
        };
      }),
      isFeatured: s.cat === 'featured',
      promos: this.promos.map((x, i) => ({ ...x, opacity: i === s.promo ? 1 : 0, kb: i === s.promo ? 'animation: kb' + pp + ' 6s cubic-bezier(.16,1,.3,1) both' : '' })),
      promo: this.promos[s.promo],
      promoAnim: 'promo' + pp,
      promoDots: this.promos.map((x, i) => ({
        label: 'Show ' + x.title,
        go: () => this.goPromo(i),
        fill: i < s.promo ? 'transform: scaleX(1)' : (i === s.promo ? 'animation: prog' + pp + ' 5000ms linear both' : 'transform: scaleX(0)')
      })),
      sectionTitle: s.cat === 'featured' ? 'Popular now' : this.cats[idx].label,
      countLabel: list.length + ' items',
      headAnim: 'head' + p,
      cards: list.map((x, i) => ({
        ...x,
        hasBadge: !!x.badge,
        badgeFg: x.badge === 'New' || x.badge === 'Best seller' ? accent : '#171513',
        priceFmt: this.fmt(x.price),
        anim: 'card' + p,
        delay: 220 + i * 60,
        added: s.justAdded === x.id,
        notAdded: s.justAdded !== x.id,
        btnBg: s.justAdded === x.id ? accent : '#F1EDE7',
        add: (e) => this.add(x, e)
      })),
      flying: !!s.fly,
      fly: s.fly || { x: 0, y: 0, dx: 0, dy: 0, img: '', tone: '#E9DED0' },
      flyAnim: 'fly' + cp,
      thumbs: s.cart.slice(-3).reverse().map((l) => ({ img: l.img, tone: l.tone })),
      countLabel2: count + ' items',
      totalFmt: this.fmt(total),
      bumpAnim: s.cartTick ? 'bump' + cp + ' 460ms cubic-bezier(.3,1.4,.5,1) 650ms both' : 'none',
      ctaAnim: s.cartTick ? 'bump' + cp + ' 460ms cubic-bezier(.3,1.4,.5,1) 700ms both' : 'none',
      rollAnim: s.cartTick ? 'roll' + cp + ' 480ms cubic-bezier(.16,1,.3,1) 650ms both' : 'none'
    };
  }
}
</script>
</body>
</html>

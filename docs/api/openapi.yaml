    get:
      operationId: "getHealth"
      summary: "E14 — Backend and gateway reachability"
      tags:
        - "System"
      parameters:
        - "$ref": "#/components/parameters/XAppVersion"
        - "$ref": "#/components/parameters/AcceptLanguage"
        - "$ref": "#/components/parameters/XMockScenario"
      responses:
        "200":
          description: "Health."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
              examples:
                default:
                  summary: "All OK"
                  value:
                    status: "OK"
                    serverTime: "2026-10-22T07:15:30Z"
                    components:
                      api: "OK"
                      database: "OK"
                      paymentGateway: "OK"
                gatewayDown:
                  summary: "Gateway down"
                  value:
                    status: "DEGRADED"
                    serverTime: "2026-10-22T07:15:30Z"
                    components:
                      api: "OK"
                      database: "OK"
                      paymentGateway: "DOWN"
      security: []
components:
  securitySchemes:
    deviceToken:
      type: "http"
      scheme: "bearer"
      description: "deviceToken returned by E1."
  parameters:
    DeviceId:
      name: "deviceId"
      in: "path"
      required: true
      schema:
        type: "string"
      example: "dev_0003"
    MerchantId:
      name: "merchantId"
      in: "path"
      required: true
      schema:
        type: "string"
      example: "mer_urbangrill"
    OrderId:
      name: "orderId"
      in: "path"
      required: true
      schema:
        type: "string"
      example: "ord_7Hq2k9"
    PaymentId:
      name: "paymentId"
      in: "path"
      required: true
      schema:
        type: "string"
      example: "pay_Q1x8"
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      schema:
        type: "string"
        format: "uuid"
      description: "Same key + same body returns the same result and never creates a duplicate."
    IdempotencyKeyOptional:
      name: "Idempotency-Key"
      in: "header"
      required: false
      schema:
        type: "string"
        format: "uuid"
    IfNoneMatch:
      name: "If-None-Match"
      in: "header"
      required: false
      schema:
        type: "string"
      example: "\"cfg-42\""
    XAppVersion:
      name: "X-App-Version"
      in: "header"
      required: false
      schema:
        type: "string"
      example: "0.3.0"
    XDeviceId:
      name: "X-Device-Id"
      in: "header"
      required: false
      schema:
        type: "string"
      example: "dev_0003"
    AcceptLanguage:
      name: "Accept-Language"
      in: "header"
      required: false
      schema:
        type: "string"
        enum:
          - "en"
          - "id"
    XMockScenario:
      name: "X-Mock-Scenario"
      in: "header"
      required: false
      schema:
        type: "string"
      description: "Scenario name from api-spec.md §4. Ignored by Prism (use the Prefer header); honoured by a custom mock server."
  responses:
    Unauthorized:
      description: "Device token revoked or missing → app returns to Sign in."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          examples:
            tokenInvalid:
              summary: "Token invalid"
              value:
                code: "TOKEN_INVALID"
                message: "Device token is invalid."
                details: {}
    ServerError:
      description: "Server error; idempotent calls are retried (1 s / 2 s / 4 s)."
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
          examples:
            serverError:
              summary: "Server error"
              value:
                code: "SERVER_ERROR"
                message: "Unexpected error."
                details: {}
  schemas:
    LocalizedText:
      type: "object"
      description: "Localized text; the app falls back to the other language."
      properties:
        en:
          type: "string"
        id:
          type: "string"
    Error:
      type: "object"
      properties:
        code:
          type: "string"
          enum:
            - "VALIDATION_ERROR"
            - "TOKEN_INVALID"
            - "DEVICE_DISABLED"
            - "DEVICE_NOT_REGISTERED"
            - "NOT_FOUND"
            - "PRICE_CHANGED"
            - "ITEM_UNAVAILABLE"
            - "MERCHANT_NOT_LIVE"
            - "MERCHANT_CLOSED"
            - "ORDER_ALREADY_PAID"
            - "ORDER_NOT_AWAITING_PAYMENT"
            - "PAYMENT_NOT_CANCELLABLE"
            - "PIN_INCORRECT"
            - "PAYMENT_METHOD_UNAVAILABLE"
            - "RATE_LIMITED"
            - "SERVER_ERROR"
            - "GATEWAY_ERROR"
        message:
          type: "string"
        details:
          type: "object"
          additionalProperties: true
      required:
        - "code"
        - "message"
    Merchant:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        cuisine:
          "$ref": "#/components/schemas/LocalizedText"
        logoUrl:
          type: "string"
          nullable: true
        photoUrl:
          type: "string"
          nullable: true
        status:
          type: "string"
          enum:
            - "live"
            - "coming_soon"
        isOpen:
          type: "boolean"
        opensAt:
          type: "string"
          format: "date-time"
          nullable: true
      required:
        - "id"
        - "name"
        - "status"
        - "isOpen"
    ActivateRequest:
      type: "object"
      properties:
        serialNumber:
          type: "string"
        model:
          type: "string"
        osVersion:
          type: "string"
        appVersion:
          type: "string"
      required:
        - "serialNumber"
        - "appVersion"
    ActivateResponse:
      type: "object"
      properties:
        deviceId:
          type: "string"
        deviceToken:
          type: "string"
        tokenExpiresAt:
          type: "string"
          format: "date-time"
          nullable: true
        kioskCode:
          type: "string"
        kioskName:
          type: "string"
        boundMerchantId:
          type: "string"
          nullable: true
        merchants:
          type: "array"
          items:
            "$ref": "#/components/schemas/Merchant"
      required:
        - "deviceId"
        - "deviceToken"
        - "kioskCode"
        - "kioskName"
        - "merchants"
    MerchantList:
      type: "object"
      properties:
        merchants:
          type: "array"
          items:
            "$ref": "#/components/schemas/Merchant"
      required:
        - "merchants"
    BindingRequest:
      type: "object"
      properties:
        merchantId:
          type: "string"
      required:
        - "merchantId"
    BindingResponse:
      type: "object"
      properties:
        deviceId:
          type: "string"
        merchantId:
          type: "string"
        kioskName:
          type: "string"
        boundAt:
          type: "string"
          format: "date-time"
      required:
        - "deviceId"
        - "merchantId"
    StaffPin:
      type: "object"
      properties:
        algorithm:
          type: "string"
          enum:
            - "PBKDF2WithHmacSHA256"
            - "PLAIN_MOCK_ONLY"
        iterations:
          type: "integer"
        salt:
          type: "string"
        hash:
          type: "string"
        version:
          type: "integer"
      required:
        - "algorithm"
        - "hash"
        - "version"
    Promo:
      type: "object"
      properties:
        id:
          type: "string"
        type:
          type: "string"
          enum:
            - "THRESHOLD_FIXED"
        threshold:
          type: "integer"
          minimum: 0
          description: "Integer Rupiah (IDR)."
        amount:
          type: "integer"
          minimum: 0
          description: "Integer Rupiah (IDR)."
        label:
          "$ref": "#/components/schemas/LocalizedText"
      required:
        - "id"
        - "type"
        - "threshold"
        - "amount"
    PaymentMethodConfig:
      type: "object"
      properties:
        method:
          type: "string"
          enum:
            - "QRIS"
            - "CARD"
        enabled:
          type: "boolean"
        qrisMerchantIdMasked:
          type: "string"
        qrExpirySecondsAllowed:
          type: "array"
          items:
            type: "integer"
        qrExpirySecondsDefault:
          type: "integer"
        terminal:
          type: "object"
          properties:
            tid:
              type: "string"
            connection:
              type: "string"
      required:
        - "method"
        - "enabled"
    MerchantConfig:
      type: "object"
      properties:
        configVersion:
          type: "string"
        merchantId:
          type: "string"
        mode:
          type: "string"
          enum:
            - "SINGLE"
            - "FOOD_COURT"
        brandName:
          type: "string"
        accentColor:
          type: "string"
          pattern: "^#[0-9A-Fa-f]{6}$"
        logoUrl:
          type: "string"
          nullable: true
        heroPhotoUrl:
          type: "string"
          nullable: true
        isOpen:
          type: "boolean"
        currency:
          type: "string"
          enum:
            - "IDR"
        tax:
          type: "object"
          properties:
            label:
              "$ref": "#/components/schemas/LocalizedText"
            rateBasisPoints:
              type: "integer"
            inclusive:
              type: "boolean"
          required:
            - "rateBasisPoints"
            - "inclusive"
        rounding:
          type: "object"
          properties:
            allowedSteps:
              type: "array"
              items:
                type: "integer"
            default:
              type: "integer"
            mode:
              type: "string"
              enum:
                - "UP"
        promos:
          type: "array"
          items:
            "$ref": "#/components/schemas/Promo"
        orderTypes:

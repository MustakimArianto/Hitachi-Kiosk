                  method: "QRIS"
                  qrExpirySeconds: 300
              card:
                summary: "Card"
                value:
                  method: "CARD"
  "/v1/orders/{orderId}/payments/{paymentId}":
    get:
      operationId: "getPayment"
      summary: "E10 — Payment status (polled every 2 s)"
      tags:
        - "Payments"
      parameters:
        - "$ref": "#/components/parameters/OrderId"
        - "$ref": "#/components/parameters/PaymentId"
        - "$ref": "#/components/parameters/XAppVersion"
        - "$ref": "#/components/parameters/AcceptLanguage"
        - "$ref": "#/components/parameters/XMockScenario"
        - "$ref": "#/components/parameters/XDeviceId"
      responses:
        "200":
          description: "Current status."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Payment"
              examples:
                pending:
                  summary: "Waiting for customer"
                  value:
                    paymentId: "pay_Q1x8"
                    method: "QRIS"
                    status: "PENDING"
                    amount: 172700
                    expiresAt: "2026-10-22T07:20:31Z"
                processing:
                  summary: "Confirming"
                  value:
                    paymentId: "pay_Q1x8"
                    method: "QRIS"
                    amount: 172700
                    status: "PROCESSING"
                paid:
                  summary: "Paid"
                  value:
                    paymentId: "pay_Q1x8"
                    method: "QRIS"
                    status: "PAID"
                    amount: 172700
                    paidAt: "2026-10-22T07:16:02Z"
                    reference: "QR-8812-4471-0091"
                    issuer: "GoPay"
                    order:
                      orderId: "ord_7Hq2k9"
                      orderNumber: "A247"
                      status: "PAID"
                declined:
                  summary: "Card declined"
                  value:
                    paymentId: "pay_C7m2"
                    method: "CARD"
                    status: "FAILED"
                    amount: 172700
                    reason: "DECLINED"
                    message:
                      en: "Your bank declined the card."
                      id: "Bank Anda menolak kartu."
                cancelledByPayer:
                  summary: "Cancelled in e-wallet"
                  value:
                    paymentId: "pay_Q1x8"
                    method: "QRIS"
                    status: "FAILED"
                    amount: 172700
                    reason: "CANCELLED_BY_PAYER"
                    message:
                      en: "The payment was cancelled in your app."
                      id: "Pembayaran dibatalkan di aplikasi Anda."
                terminalTimeout:
                  summary: "Terminal timeout"
                  value:
                    paymentId: "pay_C7m2"
                    method: "CARD"
                    status: "FAILED"
                    amount: 172700
                    reason: "TERMINAL_TIMEOUT"
                    message:
                      en: "The card terminal didn't respond."
                      id: "Terminal kartu tidak merespons."
                expired:
                  summary: "QR expired"
                  value:
                    paymentId: "pay_Q1x8"
                    method: "QRIS"
                    status: "EXPIRED"
                    amount: 172700
                    expiresAt: "2026-10-22T07:20:31Z"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          description: "Unknown payment."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                notFound:
                  summary: "Not found"
                  value:
                    code: "NOT_FOUND"
                    message: "Payment not found."
                    details: {}
        "500":
          "$ref": "#/components/responses/ServerError"
      description: "Prism returns `pending` by default. Use `Prefer: example=paid` (or declined, expired, …) to simulate outcomes."

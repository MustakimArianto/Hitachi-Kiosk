      tags:
        - "Payments"
      parameters:
        - "$ref": "#/components/parameters/OrderId"
        - "$ref": "#/components/parameters/IdempotencyKey"
        - "$ref": "#/components/parameters/XAppVersion"
        - "$ref": "#/components/parameters/AcceptLanguage"
        - "$ref": "#/components/parameters/XMockScenario"

                        - groupId: "mg_meal_upgrade"
                          optionId: "opt_make_meal"
                        - groupId: "mg_b2_ingredients"
                          optionId: "ing_cheddar"
                          level: "EXTRA"
                        - groupId: "mg_b2_ingredients"
                          optionId: "ing_onion"
                          level: "NONE"
                      unitPrice: 75000
                      lineTotal: 75000
                    - lineId: "l2"
                      kind: "PRODUCT"

      responses:
        "201":
          description: "Payment started."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Payment"
              examples:
                qris:
                  summary: "QRIS payment"
                  value:
                    paymentId: "pay_Q1x8"
                    method: "QRIS"
                    status: "PENDING"
                    amount: 172700
                    qrString: "00020101021226650013ID.CO.EXAMPLE.WWW0118936000000000000000303UMI51440014ID.CO.QRIS.WWW0215ID1020000004721520458125303360540617270058"
                    expiresAt: "2026-10-22T07:20:31Z"
                    createdAt: "2026-10-22T07:15:31Z"
                card:
                  summary: "Card payment on EDC terminal"
                  value:
                    paymentId: "pay_C7m2"
                    method: "CARD"
                    status: "PENDING"
                    amount: 172700
                    terminalRef: "TRX-20261022-000247"
                    terminal:
                      tid: "TID 0003 1182"
                      connection: "USB"
                    timeoutSeconds: 90
                    createdAt: "2026-10-22T07:15:31Z"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "409":
          description: "Order not awaiting payment."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                wrongState:
                  summary: "Order not awaiting payment"
                  value:
                    code: "ORDER_NOT_AWAITING_PAYMENT"
                    message: "Order is not awaiting payment."
                    details: {}
        "422":
          description: "Method unavailable."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                methodUnavailable:
                  summary: "Method disabled"
                  value:
                    code: "PAYMENT_METHOD_UNAVAILABLE"
                    message: "Card payments are not enabled for this merchant."
                    details: {}
        "502":
          description: "Gateway error."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                gatewayError:
                  summary: "Gateway error"
                  value:
                    code: "GATEWAY_ERROR"
                    message: "Payment gateway unavailable."
                    details: {}
        "500":
          "$ref": "#/components/responses/ServerError"
      description: "Prism returns the `qris` example by default; send `Prefer: example=card` for the card response."

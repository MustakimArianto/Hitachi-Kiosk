  "/v1/orders":
    post:
      operationId: "createOrder"
      summary: "E7 — Create order (backend re-prices and assigns order number)"
      tags:
        - "Orders"
      parameters:
        - "$ref": "#/components/parameters/IdempotencyKey"
        - "$ref": "#/components/parameters/XAppVersion"
        - "$ref": "#/components/parameters/AcceptLanguage"
        - "$ref": "#/components/parameters/XMockScenario"
        - "$ref": "#/components/parameters/XDeviceId"
      responses:
        "201":
          description: "Order created."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/OrderResponse"
              examples:
                default:
                  summary: "Order A247, Rp 172.700"
                  value:
                    orderId: "ord_7Hq2k9"
                    orderNumber: "A247"
                    status: "AWAITING_PAYMENT"
                    createdAt: "2026-10-22T07:15:30Z"
                    totals:
                      subtotal: 167000
                      discount: 10000
                      promoId: "promo_10k_over_100k"
                      tax: 15700
                      rounding: 0
                      total: 172700
                    lines:
                      - lineId: "l1"
                        description:
                          en: "Fries · Cola · Extra cheddar · No onion"
                          id: "Kentang · Cola · Ekstra cheddar · Tanpa bawang"
                        lineTotal: 75000
        "400":
          description: "Invalid order."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                invalidRequest:
                  summary: "Missing header or invalid body"
                  value:
                    code: "VALIDATION_ERROR"
                    message: "Invalid order request (check Idempotency-Key and body)."
                    details: {}
                quantityTooHigh:
                  summary: "Quantity above 20"
                  value:
                    code: "VALIDATION_ERROR"
                    message: "quantity must be at most 20."
                    details:
                      lineId: "l1"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "409":
          description: "Order rejected."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                priceChanged:
                  summary: "Prices changed"
                  value:
                    code: "PRICE_CHANGED"
                    message: "Prices have changed since the menu was loaded."
                    details:
                      menuVersion: "menu-119"
                      configVersion: "cfg-42"
                      serverTotals:
                        subtotal: 169000
                        discount: 10000
                        tax: 15900
                        rounding: 0
                        total: 174900
                itemUnavailable:
                  summary: "Item sold out"
                  value:
                    code: "ITEM_UNAVAILABLE"
                    message: "Some items are sold out."
                    details:
                      lineIds:
                        - "l2"
                      productIds:
                        - "c1"
                merchantClosed:
                  summary: "Merchant closed"
                  value:
                    code: "MERCHANT_CLOSED"
                    message: "The restaurant isn't taking orders right now."
                    details: {}
        "500":
          "$ref": "#/components/responses/ServerError"
        "503":
          description: "Temporary failure; retry with the same Idempotency-Key."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
              examples:
                serverError:
                  summary: "Server error"
                  value:
                    code: "SERVER_ERROR"
                    message: "Temporary failure."
                    details: {}
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateOrderRequest"
            examples:
              default:
                summary: "Design sample cart"
                value:
                  merchantId: "mer_urbangrill"
                  orderType: "DINE_IN"
                  language: "en"
                  menuVersion: "menu-118"
                  configVersion: "cfg-42"
                  roundingStep: 0
                  lines:
                    - lineId: "l1"
                      kind: "PRODUCT"
                      productId: "b2"
